<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B1520">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Klavier lernen</title>
<script src="shared.js"></script>
<style>
:root{--bg:#F5F1EA;--card:#fff;--ink:#14283B;--muted:#4D5F70;--line:#DDD5C8;--acc:#17466E;--on:#fff;--ok:#3F5F45;--bad:#A3352B;--key:#fff;--keyl:#8d8478;--blk:#1c2530}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1A24;--card:#172633;--ink:#E7EDF2;--muted:#A3B3C2;--line:#2B3D4E;--acc:#8CBBEA;--on:#0B1520;--ok:#86B08D;--bad:#E08A80;--key:#EFEAE0;--keyl:#6c7a88;--blk:#0a0f15;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0F1A24;--card:#172633;--ink:#E7EDF2;--muted:#A3B3C2;--line:#2B3D4E;--acc:#8CBBEA;--on:#0B1520;--ok:#86B08D;--bad:#E08A80;--key:#EFEAE0;--keyl:#6c7a88;--blk:#0a0f15;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:700px;margin:0 auto;padding:14px 14px 80px;display:grid;gap:12px}
h1{font-size:1.5rem;margin:2px 0 0}h2{font-size:1.1rem;margin:0}
.muted{color:var(--muted)}.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;min-height:46px;cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.btn[aria-pressed=true]{background:var(--acc);color:var(--on);border-color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
details.ch{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
details.ch>summary{cursor:pointer;padding:10px 12px;min-height:46px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700;list-style:none}
details.ch>summary::-webkit-details-marker{display:none}
details.ch>summary::after{content:"▾";margin-left:6px;color:var(--muted)}
details.ch[open]>summary::after{content:"▴"}
details.ch .cd{padding:0 12px 6px;color:var(--muted);font-size:.86rem}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:8px 12px 12px}
.les{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;display:grid;gap:2px;cursor:pointer;font:inherit;min-height:84px;align-content:start}
.les b{font-size:.98rem}.les .st{letter-spacing:2px;color:#d99a00;font-size:1.05rem}.les .sub{font-size:.8rem;color:var(--muted)}
body.kid .les{min-height:104px}body.kid .les b{font-size:1.12rem}
.stage{display:grid;gap:8px}
.bar{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:18px}
.bar i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.bar i.done{background:var(--c,var(--acc))}.bar i.cur{outline:3px solid var(--ink);outline-offset:1px;background:var(--c,var(--acc))}
#staff{width:100%;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px}
#staff .ln{stroke:var(--ink);stroke-width:1.4}
.big{display:flex;justify-content:center;align-items:center;gap:14px;min-height:64px}
.big .nm{font-size:3rem;font-weight:800;line-height:1.05;min-width:1.1em;text-align:center}
body.kid .big .nm{font-size:4.2rem}
.msg{text-align:center;min-height:1.5em;font-weight:600}
details.intro{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
details.intro summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
details.intro p{margin:4px 0 6px}
#kb{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#kb .w{fill:var(--key);stroke:var(--keyl);stroke-width:1.2}
#kb .b{fill:var(--blk);stroke:#000;stroke-width:1}
#kb .w.t{fill:var(--c)}#kb .b.t{fill:var(--c)}
#kb .w.t,#kb .b.t{animation:pulse 1s ease-in-out infinite}
#kb .w.dn{fill:#cdd9e5}#kb .b.dn{fill:#4a5a6b}
#kb .w.t.dn,#kb .b.t.dn{fill:var(--c)}
#kb .w.ok{fill:#7fd18b}#kb .no{animation:wob .35s}
#kb .lb{font:700 14px system-ui,sans-serif;fill:#14283B;pointer-events:none;text-anchor:middle}
#kb .lbb{font:700 9px system-ui,sans-serif;fill:#fff;pointer-events:none;text-anchor:middle}
body.kid #kb .lb{font-size:18px}
@keyframes pulse{50%{opacity:.55}}
@keyframes wob{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.win{text-align:center;display:grid;gap:8px;padding:10px}
.win .big2{font-size:2.4rem;letter-spacing:6px;color:#d99a00}
.chk{display:flex;gap:8px;align-items:center;min-height:40px}
.chk input{width:22px;height:22px}
.ok{color:var(--ok);font-weight:600}
.meter{height:10px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ok);display:block}
.meter u{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);display:block;left:10%}
select.btn{padding:6px 10px}
@media (prefers-reduced-motion:reduce){#kb .w.t,#kb .b.t{animation:none}}
</style>
</head>
<body>
<main>
  <h1>🎹 Klavier lernen</h1>

  <section class="card" id="picker" aria-label="Lehrgang">
    <div class="row" style="justify-content:space-between">
      <div class="seg" role="group" aria-label="Modus">
        <button class="btn" id="m-kid" type="button">🧒 Kinder</button>
        <button class="btn" id="m-norm" type="button">🎹 Normal</button>
      </div>
      <span class="small muted" id="stsum"></span>
    </div>
    <p class="small muted" style="margin:0" id="modehelp"></p>
    <button class="btn primary" id="cont" type="button"></button>
    <div id="chs" style="display:grid;gap:8px"></div>
  </section>

  <section class="card stage" id="play" hidden aria-label="Üben">
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="back" type="button">← Lehrgang</button>
      <div class="row">
        <button class="btn" id="demo" type="button">▶ Vorspielen</button>
        <button class="btn" id="restart" type="button">↻ Neu</button>
      </div>
    </div>
    <h2 id="ptitle"></h2>
    <details class="intro" id="introw"><summary>Info zur Lektion</summary><p id="intro"></p></details>
    <div class="bar" id="dots" aria-hidden="true"></div>
    <svg id="staff" viewBox="0 0 340 130" role="img" aria-label="Notenzeile"></svg>
    <div class="big"><span class="nm" id="nm" aria-live="polite"></span></div>
    <div class="msg" id="msg" role="status"></div>
    <button class="btn primary" id="go" type="button" hidden>▶ Start mit Vorzähler</button>
    <div class="win" id="win" hidden>
      <div class="big2" id="wstars"></div>
      <div id="wtxt" style="font-weight:600"></div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="again" type="button">Nochmal</button><button class="btn" id="next" type="button">Nächste Lektion</button></div>
    </div>
  </section>

  <section class="card" aria-label="Klaviatur">
    <svg id="kb" viewBox="0 0 400 150" role="group" aria-label="Klaviertasten"></svg>
    <p class="small muted" style="margin:0" id="kbhelp"></p>
  </section>

  <section class="card" aria-label="Eingabe und Einstellungen">
    <h2>Eingabe und Einstellungen</h2>
    <div class="row">
      <button class="btn" id="mic-on" type="button" aria-pressed="false">🎤 Mikrofon (echtes Klavier)</button>
      <select id="o-sens" class="btn" aria-label="Mikrofon-Empfindlichkeit"><option value="1">Empfindlichkeit: normal</option><option value="0">Empfindlichkeit: hoch</option><option value="2">Empfindlichkeit: niedrig</option></select>
    </div>
    <div id="micbox" hidden style="display:grid;gap:4px">
      <div class="meter" aria-hidden="true"><i id="lvl"></i><u id="thr"></u></div>
      <div class="small muted" id="heard" role="status">Spiele einen Ton.</div>
    </div>
    <div class="small muted" id="micmsg" role="status">Das Mikrofon hört einzelne Töne und Klatschen. Gerät nah ans Klavier, ruhiger Raum. Akkorde spielst du dann nacheinander.</div>
    <div class="row">
      <button class="btn" id="midi-on" type="button">🔌 MIDI-Keyboard verbinden</button>
      <select id="midi-dev" class="btn" aria-label="MIDI-Eingang" hidden></select>
    </div>
    <div class="small muted" id="midimsg" role="status"></div>
    <label class="chk"><input type="checkbox" id="o-oct"> Oktave egal (bei MIDI und Mikrofon zählt nur der Notenname)</label>
    <label class="chk" id="o-msw" hidden><input type="checkbox" id="o-ms"> MIDI-Töne im Browser mitspielen (aus lassen, wenn das Keyboard selbst Lautsprecher hat)</label>
    <label class="chk"><input type="checkbox" id="o-say"> Note vorlesen (für Kinder, die noch nicht lesen können)</label>
    <label class="chk"><input type="checkbox" id="o-names"> Notennamen auf allen Tasten zeigen</label>
  </section>
</main>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var NAMES=['C','D','E','F','G','A','H'],PCW=[0,2,4,5,7,9,11];
var NOTE_COL={C:'#e0453a',D:'#f08a1c',E:'#e9c200',F:'#46b04f',G:'#1fa3b8',A:'#4d7be0',H:'#a35bd0'};
var SHO=[3,0,4,1,5,2,6],FLO=[6,2,5,1,4,0,3];
var SHS=[38,35,39,36,33,37,34],FLS=[34,37,33,36,32,35,31];
var PCS=[[0,0],[0,1],[1,0],[1,1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[5,1],[6,0]];
function fq(m){return 440*Math.pow(2,(m-69)/12)}
function colN(n){return NOTE_COL[NAMES[n.l]]}
function nm(n){var L=NAMES[n.l];if(!n.a)return L;if(n.a>0)return L+'is';return L==='H'?'B':L==='E'?'Es':L==='A'?'As':L+'es'}
function mkNote(m){var pc=PCS[((m%12)+12)%12],o=Math.floor(m/12)-1;return {m:m,l:pc[0],a:pc[1],s:o*7+pc[0]}}
function whiteNote(s){var l=((s%7)+7)%7,o=Math.floor(s/7);return {m:12*(o+1)+PCW[l],s:s,a:0,l:l}}

/* ───── Lehrgang ───── */
function parseTok(t,o0){
  var p=t.split(':'),d=p[1]!=null?+p[1]:1;
  var ns=p[0].split('+').map(function(x){
    var mm=/^([CDEFGAH])(#|b)?(\d)?$/.exec(x);if(!mm)throw new Error('Token '+t);
    var li=NAMES.indexOf(mm[1]),o=mm[3]==null?o0:+mm[3],a=mm[2]==='#'?1:mm[2]==='b'?-1:0;
    return {m:12*(o+1)+PCW[li]+a,s:o*7+li,a:a,l:li};
  });
  return {n:ns,d:d};
}
function T(str,o,labs){var r=str.trim().split(/\s+/).map(function(t){return parseTok(t,o||4)});if(labs)r.forEach(function(s,i){s.lab=labs[i%labs.length]});return r}
var IVN={1:'Sekunde (2 Töne)',2:'Terz (3 Töne)',3:'Quarte (4 Töne)',4:'Quinte (5 Töne)',5:'Sexte (6 Töne)',6:'Septime (7 Töne)',7:'Oktave (8 Töne)'};
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function ivGen(ks,down,n){return function(){var out=[],i;for(i=0;i<n;i++){var k=ks[rnd(0,ks.length-1)],dn=down==='mix'?Math.random()<.5:down,s=dn?rnd(30,36):rnd(28,34),t=dn?s-k:s+k,r=whiteNote(s);
  out.push({n:[r],d:1,lab:'Start: '+nm(r)});out.push({n:[whiteNote(t)],d:1,hide:true,lab:IVN[k].split(' ')[0]+(dn?' abwärts':' aufwärts')})}return out}}
function semGen(semi,n,name){return function(){var out=[],i;for(i=0;i<n;i++){var r=whiteNote(rnd(28,34)),t=mkNote(r.m+semi);
  out.push({n:[r],d:1,lab:'Start: '+nm(r)});out.push({n:[t],d:1,lab:name+' ↑'})}return out}}
var CH=[],ALL=[];
function addCh(id,t,desc,arr){CH.push({id:id,t:t,desc:desc,ls:arr});arr.forEach(function(L){L.ch=id;ALL.push(L)})}
var TW='Zeig mir die Noten: C D E F G A H';
addCh('c1','1 · Erste Töne','Notenlinien lesen und die Tasten finden (rechte Hand, Violinschlüssel).',[
 {id:'l1',t:'Mittel-C und Nachbarn',sub:'C – D – E',rand:'C4 D4 E4',n:10,intro:'Das ist das Mittel-C: die weiße Taste direkt links von zwei schwarzen Tasten. Rechts davon folgen D und E. Je höher die Note in der Notenzeile sitzt, desto weiter rechts liegt die Taste.'},
 {id:'l2',t:'Fünf Töne',sub:'C bis G',rand:'C4 D4 E4 F4 G4',n:12,intro:'Fünf Finger, fünf Töne: Daumen auf C, kleiner Finger auf G (rechte Hand). Spiele mit festem Fingersatz, nicht mit einem Finger.'},
 {id:'l3',t:'Eine Oktave',sub:'C bis C',rand:'C4 D4 E4 F4 G4 A4 H4 C5',n:14,intro:'Nach sieben Tönen kommt wieder ein C, nur höher. Dieser Abstand heißt Oktave. Die Töne heißen C D E F G A H (das H heißt im Englischen B).'},
 {id:'l4',t:'Tief unter C',sub:'A – H – C – D – E',rand:'A3 H3 C4 D4 E4',n:12,intro:'Unter den fünf Linien helfen kurze Hilfslinien. Das Mittel-C bekommt eine eigene kleine Linie unter der Notenzeile.'},
 {id:'l5',t:'Hoch hinaus',sub:'G bis G, ein Stück höher',rand:'G4 A4 H4 C5 D5 E5 F5 G5',n:14,intro:'Eselsbrücke für die Linien von unten: E G H D F. Die Zwischenräume von unten: F A C E.'},
 {id:'l6',t:'Zwei Oktaven',sub:'C4 bis C6, gemischt',rand:'C4 D4 E4 F4 G4 A4 H4 C5 D5 E5 F5 G5 A5 H5 C6',n:20,intro:'Jetzt das ganze Feld: zwei Oktaven. Schau auf die Zeile, dann auf die Taste. Mit der Zeit brauchst du die Tastenhilfe nicht mehr.'}
]);
addCh('c2','2 · Lieder','Kleine Stücke mit den richtigen Notenlängen.',[
 {id:'s1',t:'Hot Cross Buns',sub:'3 Töne: E – D – C',seq:T('E4 D4 C4:2 E4 D4 C4:2 C4:.5 C4:.5 C4:.5 C4:.5 D4:.5 D4:.5 D4:.5 D4:.5 E4 D4 C4:2'),intro:'Hohle Noten sind lang (halbe Note: 2 Schläge). Die Achtel mit Fähnchen gehen doppelt so schnell.'},
 {id:'s2',t:'Morgen kommt der Weihnachtsmann',sub:'Melodie bis A',seq:T('C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2 G4 G4 F4 F4 E4 E4 D4:2 G4 G4 F4 F4 E4 E4 D4:2 C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2'),intro:'Dieselbe Melodie heißt auf Englisch „Twinkle, Twinkle, Little Star“. Achte auf den Sprung von C nach G.'},
 {id:'s3',t:'Alle meine Entchen',sub:'C bis A',seq:T('C4 D4 E4 F4 G4:2 G4:2 A4 A4 A4 A4 G4:4 A4 A4 A4 A4 G4:4 F4 F4 F4 F4 E4:2 E4:2 D4 D4 D4 D4 C4:4'),intro:'Die ganze Note (leer, ohne Hals) dauert vier Schläge.'},
 {id:'s4',t:'Hänschen klein',sub:'C bis G',seq:T('G4 E4 E4:2 F4 D4 D4:2 C4 D4 E4 F4 G4 G4 G4:2 G4 E4 E4:2 F4 D4 D4:2 C4 E4 G4 G4 C4:2'),intro:'Ein Zwei-Viertel-Takt: je zwei Schläge pro Takt.'},
 {id:'s5',t:'Ode an die Freude',sub:'C bis G',seq:T('E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4:1.5 D4:.5 D4:2 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4:1.5 C4:.5 C4:2'),intro:'Der Punkt hinter der Note verlängert sie um die Hälfte: Viertel mit Punkt = 1,5 Schläge.'},
 {id:'s6',t:'Bruder Jakob',sub:'C bis G',seq:T('C4 D4 E4 C4 C4 D4 E4 C4 E4 F4 G4:2 E4 F4 G4:2 G4:.5 A4:.5 G4:.5 F4:.5 E4 C4 G4:.5 A4:.5 G4:.5 F4:.5 E4 C4 C4 G3 C4:2 C4 G3 C4:2'),intro:'Ein Kanon: Später kannst du es mit jemandem versetzt spielen. Am Ende springt es nach unten zum G.'},
 {id:'s7',t:'Jingle Bells (Anfang)',sub:'C bis G',seq:T('E4 E4 E4:2 E4 E4 E4:2 E4 G4 C4:1.5 D4:.5 E4:4'),intro:'Dreimal dieselbe Note: Jedes Mal neu anschlagen.'},
 {id:'s8',t:'Happy Birthday',sub:'Tonhöhen, ohne Längen',seq:T('G4 G4 A4 G4 C5 H4 G4 G4 A4 G4 D5 C5 G4 G4 G5 E5 C5 H4 A4 F5 F5 E5 C5 D5 C5'),intro:'Hier siehst du nur die Tonhöhen. Die genauen Notenlängen lernst du im Kapitel Rhythmus.'}
]);
addCh('c3','3 · Linke Hand','Bassschlüssel: die tiefen Töne.',[
 {id:'b1',t:'Tiefes C',sub:'C – D – E, links',clef:'f',rand:'C3 D3 E3',n:10,intro:'Die linke Hand liest den Bassschlüssel (F-Schlüssel). Die zwei Punkte umrahmen die Linie des F. Das C steht im zweiten Zwischenraum von unten.'},
 {id:'b2',t:'Fünf Töne links',sub:'C bis G',clef:'f',rand:'C3 D3 E3 F3 G3',n:12,intro:'Linke Hand: kleiner Finger auf C, Daumen auf G. Die Linien von unten: G H D F A.'},
 {id:'b3',t:'Bis zum Mittel-C',sub:'C3 bis C4',clef:'f',rand:'C3 D3 E3 F3 G3 A3 H3 C4',n:14,intro:'Das Mittel-C liegt zwischen beiden Systemen: im Bassschlüssel hat es eine Hilfslinie über der Zeile, im Violinschlüssel eine darunter.'},
 {id:'b4',t:'Tiefe Töne',sub:'G2 bis G3',clef:'f',rand:'G2 A2 H2 C3 D3 E3 F3 G3',n:14,intro:'Je tiefer, desto weiter links. Tiefe Töne klingen auf dem Mikrofon etwas undeutlicher. Spiele deutlich und kräftig.'},
 {id:'b5',t:'Entchen links',sub:'Alle meine Entchen, tief',clef:'f',seq:T('C4 D4 E4 F4 G4:2 G4:2 A4 A4 A4 A4 G4:4 A4 A4 A4 A4 G4:4 F4 F4 F4 F4 E4:2 E4:2 D4 D4 D4 D4 C4:4',3),intro:'Dasselbe Lied wie vorher, aber eine Oktave tiefer im Bassschlüssel.'},
 {id:'b6',t:'Ode links',sub:'Ode an die Freude, tief',clef:'f',seq:T('E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4:1.5 D4:.5 D4:2 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4:1.5 C4:.5 C4:2',3),intro:'Spiele die Melodie mit der linken Hand.'},
 {id:'b7',t:'Wechselbass C – G',sub:'Begleitung',clef:'f',seq:T('C3 G2 C3 G2 C3 G2 C3 G2 F2 C3 F2 C3 G2 D3 G2 D3 C3 G2 C3:2'),intro:'Wechselbass: Grundton und Quinte abwechselnd. So begleitet man viele Lieder. Die Folge C – F – G – C kommt später bei den Akkorden.'}
]);
function rh(id,t,sub,intro,pat,ts,bpm){return {id:id,t:t,sub:sub,intro:intro,type:'rhythm',pat:pat,ts:ts||4,bpm:bpm}}
addCh('c4','4 · Rhythmus','Notenlängen und Pausen: Schlage im Takt auf eine beliebige Taste (oder klatsche mit Mikrofon).',[
 rh('r1','Viertel: der Grundschlag','4 gleiche Schläge','Der Grundschlag ist wie ein Herzschlag. Die Viertelnote hat einen ausgefüllten Kopf und einen Hals: ein Schlag. Nach dem Vorzähler schlägst du bei jeder Note eine Taste an.',[[1,1,1,1],[1,1,1,1]]),
 rh('r2','Halbe Noten','2 Schläge lang','Die halbe Note hat einen hohlen Kopf und dauert 2 Schläge. Du schlägst nur auf Schlag 1 an und zählst 2 innerlich mit.',[[2,2],[1,1,2]]),
 rh('r3','Ganze Noten','4 Schläge lang','Die ganze Note ist hohl und hat keinen Hals. Einmal anschlagen, vier Schläge zählen.',[[4],[2,1,1]]),
 rh('r4','Achtel','Zwei auf einen Schlag','Zwei Achtel sind so lang wie ein Viertel. Sprich „ein-und“.',[[1,1,.5,.5,1],[.5,.5,.5,.5,2]]),

function detect(buf,sr){
  var N=buf.length,W=2048,minL=Math.floor(sr/1300),maxL=Math.min(Math.floor(sr/60),N-W-2),base=Math.max(0,N-W-maxL-1),i,t;

  if(e0<1e-4)return null;
  var e1=0;for(i=0;i<W;i++)e1+=buf[base+minL+i]*buf[base+minL+i];
  var nsdf=new Float32Array(maxL+2);
  for(t=minL;t<=maxL;t++){
    var c=0;for(i=0;i<W;i++)c+=buf[base+i]*buf[base+i+t];
    nsdf[t]=2*c/(e0+e1);
    e1+=buf[base+t+W]*buf[base+t+W]-buf[base+t]*buf[base+t];
  }
  var peaks=[],t0=minL,inPos=false,bi=-1,bv=-1;
  for(t=minL;t<=maxL;t++){
    if(nsdf[t]>0){if(!inPos){inPos=true;bi=-1;bv=-1}if(nsdf[t]>bv&&nsdf[t]>=nsdf[t-1]&&nsdf[t]>=nsdf[t+1]){bv=nsdf[t];bi=t}}
    else if(inPos){inPos=false;if(bi>0)peaks.push([bi,bv])}
  }
  if(inPos&&bi>0)peaks.push([bi,bv]);
  var mx=0;peaks.forEach(function(p){if(p[1]>mx)mx=p[1]});
  if(mx<.6)return null;
  var pk=null;for(i=0;i<peaks.length;i++)if(peaks[i][1]>=.88*mx){pk=peaks[i];break}
  if(!pk)return null;
  var tau=pk[0],a=nsdf[tau-1],b=nsdf[tau],c2=nsdf[tau+1],den=a-2*b+c2,sh=den?0.5*(a-c2)/den:0;
  return sr/(tau+sh);
}

    $('#mic-on').setAttribute('aria-pressed','true');$('#mic-on').textContent='🎤 Mikrofon aus';$('#micbox').hidden=false;
    msg.textContent='Mikrofon an. Spiele die leuchtende Taste auf deinem Klavier.';msg.className='small ok';

  MIC=null;$('#mic-on').setAttribute('aria-pressed','false');$('#mic-on').textContent='🎤 Mikrofon (echtes Klavier)';$('#micbox').hidden=true;$('#micmsg').textContent='Mikrofon aus.';$('#micmsg').className='small muted';

function minThr(){var v=ST.ui.sens==null?1:+ST.ui.sens;return v===0?.005:v===2?.025:.012}
function micFrame(){
  var M=MIC;if(!M)return;
  M.an.getFloatTimeDomainData(M.buf);
  var now=performance.now(),r=micRms(M.buf,M.buf.length-1024),thr=Math.max(minThr(),M.noise*4);
  $('#lvl').style.width=Math.min(100,r*500)+'%';$('#thr').style.left=Math.min(100,thr*500)+'%';
  if(now<M.ign){M.ema=r;M.pend=null;return}
  var onset=r>thr&&r>M.ema*1.7&&now-M.lastOn>150&&!M.pend;
  M.ema=M.ema*.8+r*.2;

    M.pend={t0:now,ps:[]};

  if(M.pend&&now-M.pend.t0>=70){
    var f=detect(M.buf,M.sr);if(f&&f>60&&f<1300)M.pend.ps.push(Math.round(69+12*Math.log2(f/440)));
    if(M.pend.ps.length>=4||now-M.pend.t0>300){
      var cnt={},best=null,ps=M.pend.ps;M.pend=null;
      ps.forEach(function(p){cnt[p]=(cnt[p]||0)+1;if(best==null||cnt[p]>cnt[best])best=p});
      if(best!=null&&cnt[best]>=2){var nn=mkNote(best);heardLog.push(best);$('#heard').textContent='Gehört: '+nm(nn)+' ('+best+')';onNote(best,'mic')}

    }

function setKid(v){ST.ui.kid=v;save();if(cur&&cur.type!=='rhythm'){var r=rangeFor(cur,seq);buildKb(r[0],r[1],hasAcc(cur,seq))}else buildKb(cur?60:60,cur?72:84,false);renderPicker();applyUi();if(cur&&cur.type!=='rhythm')showTarget(false)}
$('#m-kid').onclick=function(){setKid(true)};
$('#m-norm').onclick=function(){setKid(false)};
$('#o-say').onchange=function(){ST.ui.say=this.checked;save();if(this.checked)say('Ich lese dir die Noten vor.')};
$('#o-names').onchange=function(){ST.ui.names=this.checked;save();buildKb(KLO,KHI,cur&&seq.length?hasAcc(cur,seq):false);markTarget()};
$('#o-oct').onchange=function(){ST.ui.oct=this.checked;save()};
$('#o-ms').onchange=function(){ST.ui.ms=this.checked;save()};
var MIDI=null;
function bindInputs(){
  if(!MIDI)return;var sel=$('#midi-dev'),ins=[];MIDI.inputs.forEach(function(i){ins.push(i)});
  sel.innerHTML=ins.map(function(i,k){return '<option value="'+i.id+'">'+(i.name||'Eingang '+(k+1)).replace(/</g,'&lt;')+'</option>'}).join('');
  sel.hidden=!ins.length;$('#o-msw').hidden=!ins.length;
  var sid=ST.ui.mid&&ins.some(function(i){return i.id===ST.ui.mid})?ST.ui.mid:(ins[0]&&ins[0].id);if(sid)sel.value=sid;
  ins.forEach(function(i){i.onmidimessage=null});
  var a=ins.filter(function(i){return i.id===sel.value})[0]||ins[0];
  if(a)a.onmidimessage=function(e){var d=e.data,s=d[0]&0xF0;if(s===0x90&&d[2]>0)onNote(d[1],'midi')};
  $('#midimsg').textContent=ins.length?'Verbunden: '+(a?a.name:''):'Kein MIDI-Gerät gefunden. Schließe das Keyboard per USB an (bei Android mit OTG-Adapter) und tippe nochmal.';
  $('#midimsg').className=ins.length?'small ok':'small muted';
}
$('#midi-dev').onchange=function(){ST.ui.mid=this.value;save();bindInputs()};
$('#midi-on').onclick=function(){
  if(!navigator.requestMIDIAccess){$('#midimsg').textContent='Dieser Browser unterstützt kein Web-MIDI. Auf Android geht es in Chrome oder Edge, auf iPhone und iPad leider nicht. Dort bleibt das Mikrofon.';return}
  navigator.requestMIDIAccess().then(function(a){MIDI=a;a.onstatechange=bindInputs;bindInputs()},function(){$('#midimsg').textContent='MIDI wurde nicht erlaubt. Prüfe die Berechtigung in den Seiteneinstellungen.'});
};
buildKb(60,84,false);renderPicker();applyUi();
window.__kl={onNote:onNote,start:start,ALL:ALL,get seq(){return seq},get idx(){return idx},get done(){return done},get R(){return R},get heard(){return heardLog},ST:ST,rhGo:rhGo,rhTap:rhTap,rhJudge:rhJudge,detect:detect};
})();
