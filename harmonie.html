<main id="app"></main>
<script>
(function(){
'use strict';
var rnd=PF.rnd,pick=PF.pick,sh=PF.shuffle,nm=PF.nm;
function lowF(s){return s.charAt(0).toLowerCase()+s.slice(1)}
function four(correct,pool){var o=sh(pool.filter(function(x,i,a){return x!==correct&&a.indexOf(x)===i})).slice(0,3);return [correct].concat(o)}
function ch(text,correct,pool,expl,extra){var o=four(correct,pool),q={kind:'choice',text:text,opts:o,ans:0,expl:expl||''};if(extra)for(var k in extra)q[k]=extra[k];return q}
function chL(text,correct,pool,expl,extra){var pl=pool.slice();return ch(text,correct,pl,expl,extra)}
function notesStr(ns){return ns.map(nm).join(' – ')}
function chordLabel(root,key){var c=PF.CHORDS[key];return nm(root)+(key==='dur'||key==='moll'?'-':' ')+c.n}
function chordSym(root,key){return PF.sym(root)+PF.CHORDS[key].sym}
function tryGen(f){for(var i=0;i<40;i++){var q=f();if(q)return q}return null}
function stepsOf(ns,d){return ns.map(function(n){return {n:[n],d:d||1}})}
function sortM(ns){return ns.slice().sort(function(a,b){return a.m-b.m})}

/* Tonarten */
var MAJ=[['C',0],['G',1],['D',2],['A',3],['E',4],['H',5],['Fis',6],['F',-1],['B',-2],['Es',-3],['As',-4],['Des',-5]];
var MIN={0:'a',1:'e',2:'h',3:'fis',4:'cis',5:'gis',6:'dis','-1':'d','-2':'g','-3':'c','-4':'f','-5':'b'};
var CIRC=[['Ges/Fis',6],['Des',-5],['As',-4],['Es',-3],['B',-2],['F',-1],['C',0],['G',1],['D',2],['A',3],['E',4],['H',5]];
function ksLab(k){return k===0?'keine Vorzeichen':k>0?k+' ♯':(-k)+' ♭'}
var T1=[
 {id:'t1',t:'Vorzeichen zählen',sub:'Dur-Tonarten',intro:'Jede Tonart hat feste Vorzeichen. Von C-Dur aus kommt pro Quinte aufwärts ein ♯ dazu (G: 1 ♯, D: 2 ♯ …), pro Quinte abwärts ein ♭ (F: 1 ♭, B: 2 ♭ …).',n:10,gen:function(){var k=pick(MAJ.filter(function(x){return Math.abs(x[1])<=5})),pool=[];for(var i=-4;i<=5;i++)pool.push(ksLab(i));return ch('Wie viele Vorzeichen hat '+k[0]+'-Dur?',ksLab(k[1]),pool,k[0]+'-Dur: '+ksLab(k[1])+'. Parallele Moll-Tonart: '+MIN[k[1]]+'-Moll.')}},
 {id:'t2',t:'Tonart am Notenbild',sub:'Vorzeichen deuten',intro:'Aus den Vorzeichen am Zeilenanfang erkennst du die Dur-Tonart: Beim letzten ♯ gehst du einen Halbton nach oben (Leitton, dann Grundton). Beim ♭ ist das vorletzte ♭ der Name der Tonart.',n:10,gen:function(){var k=pick(MAJ.filter(function(x){return Math.abs(x[1])<=5&&x[1]!==0})),q=ch('Zu welcher Dur-Tonart gehören diese Vorzeichen?',k[0]+'-Dur',MAJ.map(function(x){return x[0]+'-Dur'}),k[0]+'-Dur hat '+ksLab(k[1])+' (oder '+MIN[k[1]]+'-Moll).');q.staff={clef:pick(['g','f']),ks:k[1],steps:[],label:'Vorzeichen'};return q}},
 {id:'t3',t:'Paralleltonarten',sub:'Dur und Moll verwandt',intro:'Jede Dur-Tonart hat eine Moll-Parallele mit denselben Vorzeichen. Sie beginnt auf der 6. Stufe (oder eine kleine Terz unter dem Dur-Grundton).',n:10,gen:function(){var k=pick(MAJ);if(Math.random()<.5)return ch('Welche Moll-Tonart ist die Parallele zu '+k[0]+'-Dur?',MIN[k[1]]+'-Moll',MAJ.map(function(x){return MIN[x[1]]+'-Moll'}),k[0]+'-Dur und '+MIN[k[1]]+'-Moll haben beide '+ksLab(k[1])+'.');return ch('Welche Dur-Tonart ist die Parallele zu '+MIN[k[1]]+'-Moll?',k[0]+'-Dur',MAJ.map(function(x){return x[0]+'-Dur'}),k[0]+'-Dur und '+MIN[k[1]]+'-Moll haben beide '+ksLab(k[1])+'.')}},
 {id:'t4',t:'Quintenzirkel',sub:'Nachbartonarten',intro:'Im Quintenzirkel liegen verwandte Tonarten nebeneinander. Rechts herum (im Uhrzeigersinn) kommt je eine Quinte höher und ein ♯ dazu, links herum ein ♭.',n:10,gen:function(){var i=rnd(1,10),up=Math.random()<.5,j=up?i+1:i-1,k=CIRC[i],a=CIRC[j];return ch('Welche Dur-Tonart liegt im Quintenzirkel '+(up?'eine Quinte über ':'eine Quinte unter ')+k[0]+'-Dur?',a[0]+'-Dur',CIRC.map(function(x){return x[0]+'-Dur'}),(up?'Eine Quinte höher: ':'Eine Quinte tiefer: ')+a[0]+'-Dur ('+ksLab(a[1])+').')}},
 {id:'t5',t:'Reihenfolge der Vorzeichen',sub:'Kreuze und B',intro:'Die Kreuze kommen immer in dieser Folge: Fis – Cis – Gis – Dis – Ais – Eis – His. Die B-Vorzeichen in umgekehrter Folge: B – Es – As – Des – Ges – Ces – Fes. Merkspruch für die Kreuze: „Fest Choral-Gesang dient allen Eifrigen Herzen“.',n:10,gen:function(){var S=['Fis','Cis','Gis','Dis','Ais','Eis','His'],F=['B','Es','As','Des','Ges','Ces','Fes'],i=rnd(0,5);if(Math.random()<.5)return ch('Welches ist das '+(i+1)+'. Kreuz?',S[i],S,'Die Reihenfolge der Kreuze: '+S.join(' – ')+'.');return ch('Welches ist das '+(i+1)+'. B?',F[i],F,'Die Reihenfolge der B-Vorzeichen: '+F.join(' – ')+'.')}}
];

/* Intervalle */
var COMMON=['kleine Sekunde','große Sekunde','kleine Terz','große Terz','reine Quarte','übermäßige Quarte','verminderte Quinte','reine Quinte','kleine Sexte','große Sexte','kleine Septime','große Septime','reine Oktave'];
function ivNotes(iv,rootNote){return PF.spell(rootNote,[0,iv.k-1],[0,iv.s])}
function ivQ(){
  var iv=PF.ivByName(pick(COMMON)),r=PF.white(rnd(28,33)),ns=ivNotes(iv,r);if(!PF.okAcc(ns))return null;return {iv:iv,ns:ns}
}
var T2=[
 {id:'n1',t:'Intervalle im Notenbild',sub:'benennen',intro:'Zuerst zählst du die Stufen (Prime = 1, Sekunde = 2, Terz = 3 …), dann die Halbtöne für die Qualität: kleine/große Intervalle bei Sekunde, Terz, Sexte, Septime; reine bei Prime, Quarte, Quinte, Oktave.',n:10,gen:function(){return tryGen(function(){var o=ivQ();if(!o)return null;var q=ch('Welches Intervall ist das?',o.iv.n,COMMON,o.ns.map(nm).join(' – ')+': '+o.iv.k+' Stufen, '+o.iv.s+' Halbtöne = '+o.iv.n+'.');q.staff={clef:'g',steps:stepsOf(o.ns)};return q})}},
 {id:'n2',t:'Intervalle bauen',sub:'auf der Tastatur',intro:'Zähle von der Startnote aus die Halbtöne. Große Terz = 4, kleine Terz = 3, reine Quinte = 7, große Sexte = 9, große Septime = 11.',n:8,gen:function(){return tryGen(function(){var o=ivQ();if(!o)return null;return {kind:'keys',mode:'set',pcOnly:true,text:'Spiele die '+o.iv.n+' über '+nm(o.ns[0])+'. (Nur der obere Ton, Oktave egal)',need:[o.ns[1].m],lo:60,hi:83,shown:nm(o.ns[1]),expl:nm(o.ns[0])+' + '+o.iv.s+' Halbtöne = '+nm(o.ns[1])+'.',staff:{clef:'g',steps:stepsOf([o.ns[0]])}}})}},
 {id:'n3',t:'Halbtöne zählen',sub:'Intervall und Halbtonzahl',intro:'Prime 0 · kleine Sekunde 1 · große Sekunde 2 · kleine Terz 3 · große Terz 4 · Quarte 5 · Tritonus 6 · Quinte 7 · kleine Sexte 8 · große Sexte 9 · kleine Septime 10 · große Septime 11 · Oktave 12.',n:10,gen:function(){var s=rnd(1,12),n=PF.SEMI[s];if(Math.random()<.5){var pool=[];for(var i=1;i<=12;i++)pool.push(String(i));return ch('Wie viele Halbtöne hat '+(s===6?'der Tritonus':'die '+n)+'?',String(s),pool,n+' = '+s+' Halbtöne.')}return ch('Welches Intervall hat '+s+' Halbtöne?',n,Object.keys(PF.SEMI).map(function(k){return PF.SEMI[k]}),s+' Halbtöne = '+n+'.')}},
 {id:'n4',t:'Umkehrung',sub:'Intervalle umdrehen',intro:'Verschiebst du den unteren Ton eine Oktave nach oben, entsteht die Umkehrung. Die Stufenzahlen ergeben zusammen 9 (Terz ↔ Sexte), die Halbtöne zusammen 12. Groß ↔ klein, rein bleibt rein.',n:10,gen:function(){var inv0=function(x){return PF.INT.filter(function(y){return y.k===9-x.k&&y.s===12-x.s})[0]},l=PF.INT.filter(function(x){return x.k>=2&&x.k<=7&&inv0(x)}),iv=pick(l),inv=inv0(iv),dat=function(n){return n.replace(/^(\S+)e /,'$1en ')};return ch('Wie heißt die Umkehrung der '+dat(iv.n)+'?',inv.n,PF.INT.map(function(x){return x.n}),iv.n.charAt(0).toUpperCase()+iv.n.slice(1)+' ('+iv.s+' Halbtöne) wird zur '+dat(inv.n)+' ('+inv.s+' Halbtöne): '+iv.k+' + '+inv.k+' = 9 Stufen, '+iv.s+' + '+inv.s+' = 12 Halbtöne.')}},
 {id:'n5',t:'Konsonanz und Dissonanz',sub:'Reibung oder Ruhe',intro:'Konsonant (ruhig): Prime, Terzen, Quinte, Sexten, Oktave. Dissonant (spannungsreich): Sekunden, Septimen, Tritonus. Die Quarte gilt in der klassischen Lehre über dem Bass als Grenzfall.',n:10,gen:function(){var C=['Prime','kleine Terz','große Terz','reine Quinte','kleine Sexte','große Sexte','reine Oktave'],D=['kleine Sekunde','große Sekunde','kleine Septime','große Septime','Tritonus'],c=Math.random()<.5,n=c?pick(C):pick(D);return {kind:'choice',text:'Ist die '+n+' konsonant oder dissonant?',opts:['konsonant','dissonant'],ans:c?0:1,expl:c?n+' klingt ruhig und stabil.':n+' klingt gespannt und möchte sich auflösen.'}}}
];

/* Tonleitern */
function scaleQ(scaleKeys,roots,kindWord){
  return function(){return tryGen(function(){
    var sk=pick(scaleKeys),rn=pick(roots),ns=PF.scaleNotes(rn,sk,4);if(!PF.okAcc(ns))return null;
    var need=ns.map(function(n){return n.m});
    return {kind:'keys',mode:'set',pcOnly:true,text:'Spiele alle Töne von '+nm(ns[0])+' '+PF.SCALES[sk].n+' (Reihenfolge und Oktave egal).',need:need,lo:60,hi:83,shown:notesStr(ns),expl:PF.SCALES[sk].n+' auf '+nm(ns[0])+': '+notesStr(ns)+'.'}
  })}
}
var DEG=['Tonika (1)','Supertonika (2)','Mediante (3)','Subdominante (4)','Dominante (5)','Submediante (6)','Leitton (7)'];
var T3=[
 {id:'s1',t:'Dur-Tonleiter bauen',sub:'Ganz-Ganz-Halb …',intro:'Dur: Ganzton, Ganzton, Halbton, Ganzton, Ganzton, Ganzton, Halbton (2-2-1-2-2-2-1 Halbtöne). Prüfe zuerst die Vorzeichen der Tonart.',n:8,gen:scaleQ(['dur'],['C','G','D','A','F','B','E','Es'])},
 {id:'s2',t:'Moll-Tonleiter bauen',sub:'natürlich Moll',intro:'Natürlich Moll: 2-1-2-2-1-2-2 Halbtöne. Du erreichst sie auch, wenn du Dur auf der parallelen 6. Stufe beginnst.',n:8,gen:scaleQ(['moll'],['A','E','D','G','C','H','F','Fis'])},
 {id:'s3',t:'Harmonisch und melodisch Moll',sub:'erhöhte 7. und 6. Stufe',intro:'Harmonisch Moll hebt die 7. Stufe an (Leitton, großer Sprung 6→7). Melodisch Moll (aufwärts) hebt 6. und 7. Stufe an.',n:8,gen:scaleQ(['harm','mel'],['A','E','D','G','C'])},
 {id:'s4',t:'Kirchentonarten bauen',sub:'Dorisch bis Lokrisch',intro:'Dorisch: Moll mit großer Sexte. Phrygisch: Moll mit kleiner Sekunde. Lydisch: Dur mit übermäßiger Quarte. Mixolydisch: Dur mit kleiner Septime. Lokrisch: Moll mit kleiner Sekunde und verminderter Quinte.',n:8,gen:scaleQ(['dor','phr','lyd','mix','loc'],['C','D','E','G','A'])},
 {id:'s5',t:'Stufennamen',sub:'Tonika, Dominante …',intro:'1 Tonika, 2 Supertonika, 3 Mediante, 4 Subdominante, 5 Dominante, 6 Submediante (Tonikaparallele), 7 Leitton (in Dur).',n:10,gen:function(){var d=rnd(0,6),k=pick(['C','G','D','F','B','A']),sc=PF.scaleNotes(k,'dur',4);if(Math.random()<.5)return ch('Wie heißt die '+(d+1)+'. Stufe einer Tonleiter?',DEG[d],DEG,'Die '+(d+1)+'. Stufe heißt '+DEG[d]+'.');return ch('Welche Stufe ist '+nm(sc[d])+' in '+k+'-Dur?',DEG[d],DEG,nm(sc[d])+' ist die '+(d+1)+'. Stufe in '+k+'-Dur: '+DEG[d]+'.')}},
 {id:'s6',t:'Pentatonik und Blues bauen',sub:'fünf bis sechs Töne',intro:'Moll-Pentatonik: 1, b3, 4, 5, b7. Dur-Pentatonik: 1, 2, 3, 5, 6. Blues: Moll-Pentatonik mit zusätzlicher b5 (Blue Note). Die Standard-Skala für Gitarrensoli.',n:8,gen:scaleQ(['pdur','pmoll','blues'],['C','G','D','A','E'])},
 {id:'s7',t:'Welcher Ton gehört nicht dazu?',sub:'Tonartkenntnis',intro:'Jede Tonart enthält sieben Töne, jeder Buchstabe kommt genau einmal vor. Ein verändertes Vorzeichen verrät den Fremdling.',n:10,gen:function(){return tryGen(function(){var rn=pick(['G','D','A','E','F','B','Es','As']),sc=PF.scaleNotes(rn,'dur',4);if(!PF.okAcc(sc))return null;var i=rnd(1,6),n=sc[i],w={m:n.m,s:n.s,l:n.l,a:n.a+(Math.random()<.5?1:-1)};if(Math.abs(w.a)>1)return null;
   var names=sc.map(nm),wn=nm(w);if(names.indexOf(wn)>=0)return null;var others=sh(names.filter(function(x,k){return k!==i})).slice(0,3);return {kind:'choice',text:'Welcher Ton gehört nicht zu '+rn+'-Dur?',opts:others.concat([wn]),ans:3,expl:rn+'-Dur: '+notesStr(sc)+'. '+wn+' gehört nicht dazu (richtig wäre '+nm(n)+').'}})}}
];

/* Akkorde */
var ROOTSX=['C','G','D','A','E','F','B','Es','As','H','Fis'];
function chordKeyQ(keys,mkText){
  return function(){return tryGen(function(){
    var key=pick(keys),rn=pick(ROOTSX),r=PF.root(rn,4),ns=PF.chordNotes(r,key);if(!PF.okAcc(ns))return null;
    return {kind:'keys',mode:'set',pcOnly:true,text:'Spiele den Akkord '+chordLabel(r,key)+' (Töne in beliebiger Reihenfolge).',need:ns.map(function(n){return n.m}),lo:60,hi:83,shown:notesStr(ns),expl:chordLabel(r,key)+': '+notesStr(ns)+' (Halbtöne '+PF.CHORDS[key].s.join('–')+').'}
  })}
}
var INVN=['Grundstellung','Sextakkord (1. Umkehrung)','Quartsextakkord (2. Umkehrung)'];
function invert(ns,k){var a=ns.map(function(n){return {m:n.m,s:n.s,l:n.l,a:n.a}}),i;for(i=0;i<k;i++){var f=a.shift();a.push({m:f.m+12,s:f.s+7,l:f.l,a:f.a})}return a}
var T4=[
 {id:'c1',t:'Dreiklänge bauen',sub:'Dur, Moll, vermindert, übermäßig',intro:'Dreiklang aus zwei Terzen: Dur = große + kleine Terz, Moll = kleine + große, vermindert = zwei kleine, übermäßig = zwei große Terzen.',n:8,gen:chordKeyQ(['dur','moll','dim','aug'])},
 {id:'c2',t:'Akkorde im Notenbild',sub:'erkennen und benennen',intro:'Akkorde stehen auf Linien oder Zwischenräumen übereinander. Finde den Grundton (unterster Ton in Terzschichtung) und prüfe die Terzen.',n:10,gen:function(){return tryGen(function(){var key=pick(['dur','moll','dim','aug']),rn=pick(ROOTSX),r=PF.root(rn,4),ns=PF.chordNotes(r,key);if(!PF.okAcc(ns))return null;
   var keys=['dur','moll','dim','aug'],pool=keys.map(function(k){return chordLabel(r,k)}),q=ch('Welcher Akkord ist das?',chordLabel(r,key),pool,chordLabel(r,key)+': '+notesStr(ns)+'.');q.staff={clef:'g',steps:[{n:ns,d:1}]};return q})}},
 {id:'c3',t:'Septakkorde bauen',sub:'maj7, 7, m7, m7b5',intro:'Septakkorde bekommen eine dritte Terz oben: maj7 = Dur + große Septime, 7 (Dominantsept) = Dur + kleine Septime, m7 = Moll + kleine Septime, m7b5 = vermindert + kleine Septime.',n:8,gen:chordKeyQ(['maj7','dom7','m7','m7b5'])},
 {id:'c4',t:'Umkehrungen im Notenbild',sub:'Grundstellung, Sext, Quartsext',intro:'Grundstellung: Grundton unten. Sextakkord: Terz unten (Intervalle 3 und 6). Quartsextakkord: Quinte unten (Intervalle 4 und 6).',n:10,gen:function(){return tryGen(function(){var key=pick(['dur','moll']),rn=pick(['C','G','D','F','A','E']),r=PF.root(rn,4),ns=PF.chordNotes(r,key);if(!PF.okAcc(ns))return null;var i=rnd(0,2),iv=invert(ns,i),q=ch('In welcher Lage steht dieser '+chordLabel(r,key)+'-Akkord?',INVN[i],INVN,'Der unterste Ton ist '+nm(sortM(iv)[0])+': '+(i===0?'der Grundton':i===1?'die Terz':'die Quinte')+'.');q.staff={clef:'g',steps:[{n:iv,d:1}]};return q})}},
 {id:'c5',t:'Akkordsymbole lesen',sub:'Am7, G7, Dsus4 …',intro:'Gitarren- und Jazz-Notation: Buchstabe = Grundton. m = Moll, 7 = Dominantsept, maj7 = große Septime, sus4/sus2 = Terz ersetzt, add9 = None dazu, dim = vermindert.',n:10,gen:function(){return tryGen(function(){var keys=['dur','moll','dom7','maj7','m7','sus4','sus2','add9','dim','aug'],key=pick(keys),rn=pick(['C','G','D','A','E','F','B']),r=PF.root(rn,4),ns=PF.chordNotes(r,key);if(!PF.okAcc(ns))return null;var correct=notesStr(ns),pool=keys.filter(function(k){return k!==key}).map(function(k){var x=PF.chordNotes(r,k);return PF.okAcc(x)?notesStr(x):null}).filter(Boolean);
   return ch('Aus welchen Tönen besteht '+chordSym(r,key)+'?',correct,pool,chordSym(r,key)+' = '+correct+' ('+PF.CHORDS[key].n+').')})}},
 {id:'c6',t:'Terzschichtung',sub:'aus welchen Terzen besteht der Akkord',intro:'Ein Dreiklang ist ein Stapel aus zwei Terzen. Welche Terz unten und welche oben liegt, entscheidet über die Klangfarbe.',n:8,gen:function(){var key=pick(['dur','moll','dim','aug']),s=PF.CHORDS[key].s,t=function(d){return d===3?'kleine Terz':'große Terz'},c=t(s[1])+' + '+t(s[2]-s[1]);return ch('Aus welchen Terzen (von unten) ist ein '+PF.CHORDS[key].n+'-Dreiklang aufgebaut?',c,['kleine Terz + kleine Terz','kleine Terz + große Terz','große Terz + kleine Terz','große Terz + große Terz'],PF.CHORDS[key].n+': '+c+'.')}}
];

/* Harmonie */
var QD=['dur','moll','moll','dur','dur','moll','dim'],QDN=['I','ii','iii','IV','V','vi','vii°'];
var QM=['moll','dim','dur','moll','moll','dur','dur'],QMN=['i','ii°','III','iv','v','VI','VII'];
function lab(n,k){return nm(n)+'-'+({dur:'Dur',moll:'Moll',dim:'vermindert'}[k])}
var FUNC={0:'Tonika',1:'Subdominante',3:'Subdominante',4:'Dominante',5:'Tonika'};
var T5=[
 {id:'h1',t:'Stufenakkorde in Dur',sub:'I bis vii°',intro:'Über jeder Stufe der Dur-Tonleiter entsteht ein Dreiklang aus Tönen der Tonleiter: I, IV, V sind Dur, ii, iii, vi sind Moll, vii° ist vermindert.',n:10,gen:function(){return tryGen(function(){var kn=pick(['C','G','D','F','A','B','E']),sc=PF.scaleNotes(kn,'dur',4);if(!PF.okAcc(sc))return null;var d=rnd(0,6),pool=sc.map(function(n,i){return lab(n,QD[i])});return ch('Welcher Akkord ist die '+QDN[d]+'. Stufe in '+kn+'-Dur?',pool[d],pool,'In '+kn+'-Dur: '+QDN.map(function(x,i){return x+' = '+pool[i]}).join(', ')+'.')})}},
 {id:'h2',t:'Stufenakkorde in Moll',sub:'natürlich Moll',intro:'In natürlich Moll: i, iv, v sind Moll, III, VI, VII sind Dur, ii° ist vermindert. In der Praxis wird die V oft zu einem Dur-Akkord erhöht (harmonisch Moll).',n:10,gen:function(){return tryGen(function(){var kn=pick(['A','E','D','G','C','H']),sc=PF.scaleNotes(kn,'moll',4);if(!PF.okAcc(sc))return null;var d=rnd(0,6),pool=sc.map(function(n,i){return lab(n,QM[i])});return ch('Welcher Akkord ist die '+QMN[d]+'. Stufe in '+lowF(kn)+'-Moll?',pool[d],pool,'In '+lowF(kn)+'-Moll: '+QMN.map(function(x,i){return x+' = '+pool[i]}).join(', ')+'.')})}},
 {id:'h3',t:'Funktionen T, S, D',sub:'Tonika, Subdominante, Dominante',intro:'Tonika (I, vi) ist der Ruhepunkt, Subdominante (IV, ii) bewegt weg, Dominante (V) will zurück zur Tonika. Eine Kadenz: T – S – D – T.',n:10,gen:function(){var d=pick([0,1,3,4,5]);return ch('Welche Funktion hat die '+QDN[d]+'. Stufe in Dur?',FUNC[d],['Tonika','Subdominante','Dominante'],QDN[d]+' = '+FUNC[d]+'.')}},
 {id:'h4',t:'Akkordfolge transponieren',sub:'Stufen in Akkorde übersetzen',intro:'Die Stufen bleiben, die Töne ändern sich mit der Tonart. I – vi – IV – V in G-Dur: G – Em – C – D.',n:10,gen:function(){return tryGen(function(){var P=[[0,5,3,4],[0,3,4,0],[0,4,5,3],[1,4,0,5]],p=pick(P),kn=pick(['C','G','D','A','F','B','E']),sc=PF.scaleNotes(kn,'dur',4);if(!PF.okAcc(sc))return null;
   var f=function(sc2,pp){return pp.map(function(d){var n=sc2[d];return PF.sym(n)+(QD[d]==='moll'?'m':QD[d]==='dim'?'dim':'')}).join(' – ')},correct=f(sc,p),pool=[];

 {id:'h7',t:'Zwischendominanten',sub:'V von V',intro:'Eine Zwischendominante ist die Dominante einer anderen Stufe. V/V (Dominante der Dominante) ist ein Dur-Akkord auf der 2. Stufe, zum Beispiel D (oder D7) in C-Dur, der zur Dominante G führt.',n:8,gen:function(){return tryGen(function(){var kn=pick(['C','G','F','D','B']),sc=PF.scaleNotes(kn,'dur',4);if(!PF.okAcc(sc))return null;var c=nm(sc[1])+'-Dur';return ch('Was ist V/V (Dominante der Dominante) in '+kn+'-Dur?',c,sc.slice(0,7).map(function(n,i){return nm(n)+'-Dur'}),'Dominante von '+nm(sc[4])+' ist die Quinte darüber: '+c+'.')})}},
