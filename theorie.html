<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1c1e24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Musiktheorie</title>
<script src="shared.js"></script>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1d1f24;--muted:#656a75;--line:#dcd8cd;--acc:#2848d2;--on:#fff;--ok:#1f8a4c;--bad:#c4452c;--star:#f2a93b;--paper:#fffdf8}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161a;--card:#1d2026;--ink:#ecebe6;--muted:#a1a5ae;--line:#2e323a;--acc:#7b94ff;--on:#10131f;--ok:#4cc27e;--bad:#ff7a5c;--paper:#23262d;color-scheme:dark}}
:root[data-theme=dark]{--bg:#14161a;--card:#1d2026;--ink:#ecebe6;--muted:#a1a5ae;--line:#2e323a;--acc:#7b94ff;--on:#10131f;--ok:#4cc27e;--bad:#ff7a5c;--paper:#23262d;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:16px 16px 80px;display:grid;gap:14px}
h1{font-size:1.6rem;margin:4px 0 0}h2{font-size:1.15rem;margin:0}h3{margin:0;font-size:1rem}
.muted{color:var(--muted)}.small{font-size:.86rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.stats{display:flex;gap:18px;flex-wrap:wrap}.stats b{font-size:1.5rem;display:block;line-height:1.1}.stats span{font-size:.8rem;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .4s}
#tabs{display:flex;gap:8px;flex-wrap:wrap}
#tabs button{flex:1;min-width:140px;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
#tabs button b{display:block}#tabs button span{font-size:.8rem;color:var(--muted)}
#tabs button[aria-selected=true]{border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.xbars{display:flex;gap:6px;align-items:flex-start;justify-content:center;padding:6px 0 4px}
.xbars button{border:0;border-radius:12px;color:#fff;font:700 1.2rem system-ui,sans-serif;cursor:pointer;flex:1;max-width:72px;min-width:0;display:flex;align-items:flex-end;justify-content:center;padding:0 0 10px;box-shadow:0 3px 0 rgba(0,0,0,.25);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.xbars button:active,.xbars button.hit{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25);filter:brightness(1.15)}
.xbars button.next{outline:4px solid var(--ink);outline-offset:2px;animation:xp .9s ease-in-out infinite}
.xbars button.no{animation:xs .25s}
@keyframes xp{50%{outline-offset:5px}}@keyframes xs{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.xbars button.next{animation:none}.xbars button.no{animation:none}}
.les{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;display:grid;gap:6px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.les .e{font-size:2rem;line-height:1}.les .t{font-weight:600}.les .d{font-size:.86rem;color:var(--muted)}
.stars{letter-spacing:2px;color:var(--star);font-size:1.1rem}.stars .off{color:var(--line)}
.kid .les .e{font-size:2.6rem}.kid .les .t{font-size:1.15rem}
.th p{margin:0 0 .6em}.th ul{margin:0 0 .6em;padding-left:1.2em}
.tip{border-left:4px solid var(--star);padding:8px 12px;background:var(--bg);border-radius:0 10px 10px 0}
.qopts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.qopts .btn{white-space:normal;text-align:center;padding:12px}
.kid .qopts .btn{font-size:1.5rem;padding:18px 10px}
.qopts .btn.right{background:var(--ok);border-color:var(--ok);color:#fff}.qopts .btn.wrong{border-color:var(--bad);color:var(--bad)}
.qstaff{background:var(--paper);border-radius:10px;padding:8px 12px;overflow-x:auto;color:var(--ink)}
.qstaff svg{max-width:100%;height:auto}
.fb{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}.fb.good{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}
.pad{height:150px;border-radius:20px;border:3px dashed var(--acc);background:var(--bg);color:var(--acc);font:inherit;font-size:1.4rem;font-weight:700;cursor:pointer;touch-action:manipulation;user-select:none}
.pad:active,.pad.hit{background:var(--acc);color:var(--on)}
.blocks{display:flex;gap:6px;align-items:stretch;min-height:44px}.blocks span{display:grid;place-items:center;background:var(--acc);color:var(--on);border-radius:8px;font-weight:600;padding:0 6px;min-width:34px}
.big-emo{font-size:3rem;line-height:1;text-align:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="app">
  <h1>Musiktheorie</h1>
  <div class="card" id="prog">
    <div class="row" style="justify-content:space-between"><strong id="who"></strong><span class="muted small" id="xp-t"></span></div>
    <div class="bar"><i id="xp-fill"></i></div>
    <div class="stats"><div><b id="st-stars">0</b><span>Sterne</span></div><div><b id="st-done">0</b><span>Lektionen</span></div><div><b id="st-streak">0</b><span>Tage in Folge</span></div></div>
  </div>
  <div id="tabs" role="tablist" aria-label="Stufe"></div>
  <section id="list" class="grid"></section>

  <section class="card" id="xylo" hidden>
    <div class="row" style="justify-content:space-between"><h2>🎹 Xylophon</h2><button class="btn" id="x-close" type="button">Zurück</button></div>
    <div class="row"><label for="x-song" class="small muted">Lied</label><select id="x-song" aria-label="Lied wählen"></select><button class="btn" id="x-again" type="button">Von vorn</button></div>
    <p id="x-hint" style="margin:0;font-weight:600"></p>
    <div class="xbars" id="x-bars" role="group" aria-label="Xylophon-Klangstäbe"></div>
    <p class="small muted" id="x-tip" style="margin:0"></p>
  </section>

  <section class="card" id="lesson" hidden>
    <div class="row" style="justify-content:space-between"><h2 id="l-title"></h2><button class="btn" id="l-close" type="button">Zurück</button></div>
    <div class="th" id="l-th"></div>
    <div class="tip" id="l-tip" hidden></div>
    <div class="row"><button class="btn primary" id="l-go" type="button">Los geht’s</button><button class="btn" id="l-say" type="button" hidden>🔊 Vorlesen</button></div>
  </section>

  <section class="card" id="quiz" hidden>
    <div class="row" style="justify-content:space-between"><strong id="q-head"></strong><button class="btn" id="q-close" type="button">Abbrechen</button></div>
    <div class="bar"><i id="q-bar"></i></div>
    <div class="big-emo" id="q-emo" hidden></div>
    <p id="q-text" style="font-weight:600;margin:0;font-size:1.1rem"></p>
    <div class="row"><button class="btn" id="q-play" type="button" hidden>▶ Anhören</button><button class="btn" id="q-say" type="button" hidden>🔊 Vorlesen</button></div>
    <div class="qstaff" id="q-staff" hidden></div>
    <div id="q-tap" hidden><div class="blocks" id="q-blocks"></div><button class="pad" id="q-pad" type="button" aria-label="Hier tippen oder klatschen">👏 Tippe hier</button><p class="small muted" id="q-tapst"></p></div>
    <div class="qopts" id="q-opts"></div>
    <div class="fb" id="q-fb" hidden></div>
    <div class="row"><button class="btn primary" id="q-next" type="button" hidden>Weiter</button><button class="btn" id="q-retry" type="button" hidden>Nochmal versuchen</button></div>
  </section>
  <section class="card" id="result" hidden>
    <h2 id="r-title"></h2><div class="stars" id="r-stars" style="font-size:2.4rem"></div><p id="r-text" style="margin:0"></p>
    <div class="row"><button class="btn primary" id="r-again" type="button">Nochmal</button><button class="btn" id="r-back" type="button">Zur Übersicht</button></div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>

/*GEN-START*/
/* ───────── Übungs- und Fragengenerator (rein, ohne Seitenbezug) ───────── */
var LET=['C','D','E','F','G','A','B'],LETSEM=[0,2,4,5,7,9,11];
var KEYS={
  'C':{l:0,a:0,f:0,minor:false,name:'C-Dur'},'G':{l:4,a:0,f:1,minor:false,name:'G-Dur'},'D':{l:1,a:0,f:2,minor:false,name:'D-Dur'},
  'A':{l:5,a:0,f:3,minor:false,name:'A-Dur'},'E':{l:2,a:0,f:4,minor:false,name:'E-Dur'},'F':{l:3,a:0,f:-1,minor:false,name:'F-Dur'},
  'Bb':{l:6,a:-1,f:-2,minor:false,name:'B-Dur'},'Eb':{l:2,a:-1,f:-3,minor:false,name:'Es-Dur'},
  'a':{l:5,a:0,f:0,minor:true,name:'a-Moll'},'e':{l:2,a:0,f:1,minor:true,name:'e-Moll'},'h':{l:6,a:0,f:2,minor:true,name:'h-Moll'},
  'fis':{l:3,a:1,f:3,minor:true,name:'fis-Moll'},'d':{l:1,a:0,f:-1,minor:true,name:'d-Moll'},'g':{l:4,a:0,f:-2,minor:true,name:'g-Moll'},'c':{l:0,a:0,f:-3,minor:true,name:'c-Moll'}
};
var PAT={major:[0,2,4,5,7,9,11],natural:[0,2,3,5,7,8,10],harmonic:[0,2,3,5,7,8,11],melodic:[0,2,3,5,7,9,11],
  dor:[0,2,3,5,7,9,10],mix:[0,2,4,5,7,9,10],phr:[0,1,3,5,7,8,10],lyd:[0,2,4,6,7,9,11]};
/* Kirchentonarten: gleiche Töne wie eine Dur-Tonleiter, nur mit anderem Grundton. f = Vorzeichen der Tonart. */
[['Ddor',1,0,0,'D-dorisch','dor'],['Edor',2,0,2,'E-dorisch','dor'],['Gdor',4,0,-2,'G-dorisch','dor'],['Ador',5,0,1,'A-dorisch','dor'],
 ['Gmix',4,0,0,'G-mixolydisch','mix'],['Dmix',1,0,1,'D-mixolydisch','mix'],['Amix',5,0,2,'A-mixolydisch','mix'],
 ['Ephr',2,0,0,'E-phrygisch','phr'],['Aphr',5,0,-1,'A-phrygisch','phr'],['Dphr',1,0,-2,'D-phrygisch','phr']].forEach(function(m){
  KEYS[m[0]]={l:m[1],a:m[2],f:m[3],minor:false,name:m[4],pat:m[5]};
});
var RHYTHMS={
  viertel:{name:'Viertel und Halbe',bars:[[1,1,1,1],[2,1,1],[1,1,2],[2,2],[1,1,1,1],[2,1,1],[1,2,1],[4]]},
  achtel:{name:'Achtel',bars:[[.5,.5,.5,.5,1,1],[1,.5,.5,1,1],[.5,.5,1,.5,.5,1],[.5,.5,.5,.5,.5,.5,.5,.5],[1,1,.5,.5,1],[.5,.5,.5,.5,2],[1,.5,.5,.5,.5,1],[4]]},
  punktiert:{name:'Punktierte Noten',bars:[[1.5,.5,1,1],[1.5,.5,1.5,.5],[2,1.5,.5],[1.5,.5,2],[1,1.5,.5,1],[3,1],[1.5,.5,1.5,.5],[4]]}
};
function tonicOct(k){var o=2;while(12*(o+1)+LETSEM[k.l]+k.a<55)o++;return o}
/* Stufe d (0 = Grundton, 7 = Oktave) einer Tonleiter mit Muster pat, richtig geschrieben. */
function degNote(k,pat,d,o0){
  var oct=Math.floor(d/7),idx=d%7,tm=12*(o0+1)+LETSEM[k.l]+k.a,m=tm+pat[idx]+12*oct;
  var li=k.l+d,o=o0+Math.floor(li/7),nat=12*(o+1)+LETSEM[li%7];
  return {s:LET[li%7],a:m-nat,o:o,m:m};
}
function patOf(k,form,down){
  if(k.pat)return PAT[k.pat];
  if(!k.minor)return PAT.major;
  if(form==='melodic')return down?PAT.natural:PAT.melodic;
  return PAT[form]||PAT.natural;
}
function typeOf(d){
  var T={4:['whole',0],2:['half',0],1:['quarter',0],.5:['eighth',0],.25:['16th',0],3:['half',1],1.5:['quarter',1],.75:['eighth',1]};
  return T[d]||null;
}
/* notes: [{s,a,o,d}] oder [{r:1,d}]; 4/4, divisions 4. Wirft, wenn ein Takt überläuft. */
function buildXml(title,fifths,bpm,notes,opt){
  opt=opt||{};var BL=opt.bar||4,BEATS=opt.beats||4,BT=opt.beatType||4,PICK=opt.pick||0;
  var bars=[],cur=[],t=0,i,n,lim=PICK||BL;
  function push(){bars.push(cur);cur=[];t=0;lim=BL}
  for(i=0;i<notes.length;i++){
    n=notes[i];
    if(t+n.d>lim+1e-9)throw new Error('Takt läuft über bei Note '+i);
    cur.push(n);t+=n.d;if(Math.abs(t-lim)<1e-9)push();
  }
  if(cur.length){var rest=lim-t;while(rest>1e-9){var r=rest>=4?4:rest>=3?3:rest>=2?2:rest>=1.5?1.5:rest>=1?1:rest>=.5?.5:.25;cur.push({r:1,d:r});rest-=r}push()}
  var body=bars.map(function(b,bi){
    var h=bi===0?'<attributes><divisions>4</divisions><key><fifths>'+fifths+'</fifths></key><time><beats>'+BEATS+'</beats><beat-type>'+BT+'</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes><direction placement="above"><direction-type><words>'+title.replace(/[&<>]/g,'')+'</words></direction-type><sound tempo="'+bpm+'"/></direction>':'';
    var x=b.map(function(n){
      var ty=typeOf(n.d);if(!ty)throw new Error('Notenwert '+n.d);
      var core=n.r?'<rest/>':'<pitch><step>'+n.s+'</step>'+(n.a?'<alter>'+n.a+'</alter>':'')+'<octave>'+n.o+'</octave></pitch>';
      return '<note>'+core+'<duration>'+Math.round(n.d*4)+'</duration><type>'+ty[0]+'</type>'+(ty[1]?'<dot/>':'')+'</note>';
    }).join('');
    var end=bi===bars.length-1?'<barline location="right"><bar-style>light-heavy</bar-style></barline>':'';
    return '<measure number="'+(PICK?bi:bi+1)+'"'+(PICK&&bi===0?' implicit="yes"':'')+'>'+h+x+end+'</measure>';
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8"?><score-partwise version="3.1"><work><work-title>'+title.replace(/[&<>]/g,'')+'</work-title></work><part-list><score-part id="P1"><part-name>Violine</part-name></score-part></part-list><part id="P1">'+body+'</part></score-partwise>';
}
/* Folge aus Noten, die letzte Note füllt den Takt auf. */
function seqWithTail(notes,base){
  var sum=0;notes.forEach(function(n){n.d=base;sum+=base});
  var last=notes[notes.length-1];sum-=base;
  var mod=sum%4,tail=mod===0?4:4-mod;
  last.d=tail;
  return notes;
}
function scaleDegrees(oct){
  var up=[],down=[],i;
  for(i=0;i<=7*oct;i++)up.push(i);
  for(i=7*oct-1;i>=0;i--)down.push(i);
  return {up:up,down:down};
}
function genScale(id,o){
  o=o||{};var k=KEYS[id],o0=o.o0||tonicOct(k),oct=o.octaves||1,form=o.form||'natural',base=o.rhythm==='e'?.5:1,ds=scaleDegrees(oct),notes=[];
  ds.up.forEach(function(d){var n=degNote(k,patOf(k,form,false),d,o0);notes.push({s:n.s,a:n.a,o:n.o,d:base,m:n.m})});
  ds.down.forEach(function(d){var n=degNote(k,patOf(k,form,true),d,o0);notes.push({s:n.s,a:n.a,o:n.o,d:base,m:n.m})});
  seqWithTail(notes,base);
  var formName=k.minor?(form==='harmonic'?' (harmonisch)':form==='melodic'?' (melodisch)':' (natürlich)'):'';
  var title=k.name+(k.pat?'':'-Tonleiter')+formName+', '+oct+' Oktave'+(oct>1?'n':'');
  return {title:title,xml:buildXml(title,k.f,o.bpm||60,notes),bpm:o.bpm||60,notes:notes};
}
function genArpeggio(id,o){
  o=o||{};var k=KEYS[id],o0=tonicOct(k),oct=o.octaves||1,pat=patOf(k,'natural',false),degs=[],i,tri=[0,2,4];
  for(var r=0;r<oct;r++)tri.forEach(function(d){degs.push(d+7*r)});
  degs.push(7*oct);
  var up=degs.slice(),down=degs.slice(0,-1).reverse();
  var seq=up.concat(down),notes=seq.map(function(d){var n=degNote(k,pat,d,o0);return {s:n.s,a:n.a,o:n.o,d:1,m:n.m}});
  seqWithTail(notes,1);
  var title=k.name+'-Dreiklang, '+oct+' Oktave'+(oct>1?'n':'');
  return {title:title,xml:buildXml(title,k.f,o.bpm||60,notes),bpm:o.bpm||60,notes:notes};
}
var IVN={2:'Sekunde',3:'Terz',4:'Quarte',5:'Quinte',6:'Sexte',7:'Septime',8:'Oktave'};
function genIntervals(id,n,o){
  o=o||{};var k=KEYS[id],o0=tonicOct(k),pat=patOf(k,'natural',false),notes=[],t;
  for(t=0;t<5;t++){
    [t,t+n-1].forEach(function(d){var x=degNote(k,pat,d,o0);notes.push({s:x.s,a:x.a,o:x.o,d:1,m:x.m})});
  }
  seqWithTail(notes,1);
  var title=IVN[n]+'n in '+k.name;
  return {title:title,xml:buildXml(title,k.f,o.bpm||60,notes),bpm:o.bpm||60,notes:notes};
}
function genRhythm(pid,o){
  o=o||{};var p=RHYTHMS[pid],notes=[];
  p.bars.forEach(function(b){b.forEach(function(d){notes.push({s:'A',a:0,o:4,d:d,m:69})})});
  var title='Rhythmus: '+p.name+' auf der A-Saite';
  return {title:title,xml:buildXml(title,0,o.bpm||70,notes),bpm:o.bpm||70,notes:notes};
}
var STR=[{s:'G',o:3,m:55},{s:'D',o:4,m:62},{s:'A',o:4,m:69},{s:'E',o:5,m:76}];
function genOpen(kind,o){
  o=o||{};var notes=[],S4=function(i,d){var x=STR[i];notes.push({s:x.s,a:0,o:x.o,d:d,m:x.m})};
  if(kind==='slow'){[0,1,2,3].forEach(function(i){S4(i,4)})}
  else if(kind==='q'){[0,1,2,3].forEach(function(i){for(var j=0;j<4;j++)S4(i,1)})}
  else{
    [[0,1],[2,3],[3,2],[1,0],[0,2],[1,3]].forEach(function(p){p.forEach(function(i){S4(i,2)})});
    [0,1,2,3,3,2,1,0].forEach(function(i){S4(i,1)});S4(0,4);
  }
  var title=kind==='slow'?'Die vier Leersaiten (ganze Noten)':kind==='q'?'Leersaiten in Vierteln':'Leersaiten: Notennamen lesen';
  return {title:title,xml:buildXml(title,0,o.bpm||60,notes),bpm:o.bpm||60,notes:notes};
}
/* Übung im Stil einer schwedischen Polska: 3/4, langer erster Schlag, moll oder modal. Kein echtes Volkslied. */
var POLSKA=[[[0,1.5],[2,.5],[4,1]],[[3,1.5],[2,.5],[1,1]],[[2,1.5],[4,.5],[5,1]],[[4,1.5],[2,.5],[0,1]],
  [[4,1.5],[5,.5],[6,1]],[[7,1.5],[6,.5],[5,1]],[[4,1.5],[3,.5],[2,1]],[[1,1],[0,2]]];
function genPolska(id,o){
  o=o||{};var k=KEYS[id],o0=o.o0||tonicOct(k),pat=patOf(k,'natural',false),notes=[];
  POLSKA.forEach(function(b){b.forEach(function(x){var n=degNote(k,pat,x[0],o0);notes.push({s:n.s,a:n.a,o:n.o,d:x[1],m:n.m})})});
  var title='Polska-Übung in '+k.name+' (im Stil, kein echtes Volkslied)',bpm=o.bpm||80;
  return {title:title,xml:buildXml(title,k.f,bpm,notes,{bar:3,beats:3,beatType:4}),bpm:bpm,notes:notes};
}
/* Metal-Riffs auf der Geige: Galopp auf leeren Saiten und ein Tritonus-Riff. Eigene Bausteine, keine Zitate. */
function genRiff(kind,o){

  function gal(s,a,oc,n){for(var i=0;i<n;i++){notes.push(N(s,a,oc,.5),N(s,a,oc,.25),N(s,a,oc,.25))}}
  if(kind==='tri'){
    title='Riff mit Tritonus (D und As)';
    [0,1].forEach(function(r){
      notes.push(N('D',0,4,1),N('A',-1,4,1),N('D',0,4,1),N('A',0,4,1));
      notes.push(N('D',0,4,1),N('A',-1,4,1),N('D',0,4,2));
    });
    notes.push(N('D',0,4,4));
  }else{
    title='Galopp-Riff auf D und A';
    gal('D',0,4,4);gal('D',0,4,2);gal('E',-1,4,2);gal('D',0,4,4);
    gal('A',0,4,4);gal('A',0,4,2);gal('B',-1,4,2);gal('A',0,4,3);notes.push(N('A',0,4,1));
  }
  return {title:title,xml:buildXml(title,0,bpm,notes),bpm:bpm,notes:notes};
}
/* spec: {gen:'scale'|'arpeggio'|'intervals'|'rhythm'|'open', key, form, octaves, rhythm, interval, preset, kind, bpm} */
function makeExercise(sp){

  if(g==='scale')return genScale(sp.key,sp);
  if(g==='arpeggio')return genArpeggio(sp.key,sp);
  if(g==='intervals')return genIntervals(sp.key,sp.interval||3,sp);
  if(g==='polska')return genPolska(sp.key,sp);

}

function qNote(r,o){

  while(opts.length<4&&tries++<50){

    if(opts.indexOf(nm)<0)opts.push(nm);
  }
  opts=shuffle(r,opts);

}

function staffSvg(ns){

    for(var s2=10;s2<=steps;s2+=2)svg+='<line x1="'+(x-12)+'" x2="'+(x+12)+'" y1="'+(y0-5*s2)+'" y2="'+(y0-5*s2)+'" stroke="currentColor" stroke-width="1.2"/>';

 {id:'k3',s:'kita',e:'🐢',t:'Schnell und langsam',d:'Schnecke und Hase',th:'<p>Musik kann <b>schnell</b> sein wie ein Hase oder <b>langsam</b> wie eine Schnecke. Wir hören Klick-Reihen und finden die schnellere.</p>',tip:'Geht zu Musik im Takt: erst langsam wie eine Schnecke, dann schnell wie ein Hase. Oder: Mit den Füßen den Takt stampfen.',g:['tempo','tempo','tempo','tempo','tempo']},
 {id:'k4',s:'kita',e:'⏱',t:'Lang und kurz',d:'Töne haben eine Länge',th:'<p>Ein Ton kann <b>kurz</b> sein oder <b>lang</b>. Kurz wie ein Tropfen, lang wie ein Gummiband, das man zieht.</p>',tip:'Summt einen Ton so lange wie ihr könnt, dann ganz kurz. Wer hält länger durch?',g:['lng','lng','lng','lng','lng']},
 {id:'k5',s:'kita',e:'🪜',t:'Treppen aus Tönen',d:'Hinauf, hinunter und zählen',th:'<p>Wenn Töne Stufen hinaufgehen, steigt die Melodie wie eine <b>Treppe</b>. Geht sie hinunter, steigen wir die Treppe ab. Wir zählen auch, wie viele Töne wir hören.</p>',tip:'Baut eine Treppe aus Bauklötzen oder Kissen und singt bei jeder Stufe einen Ton, hinauf und hinunter.',g:['steps','count','steps','count','steps']},
 {id:'k6',s:'kita',e:'😀',t:'Fröhlich und traurig',d:'Wie Musik sich anfühlt',th:'<p>Manche Musik klingt <b>fröhlich</b>, andere <b>traurig</b>. Musiker nennen das <b>Dur</b> und <b>Moll</b>.</p>',tip:'Fragt beim nächsten Lied im Radio: Ist es fröhlich oder traurig? Malt zu Musik passende Gesichter.',g:['mood','mood','mood','mood','mood']},
 {id:'k7',s:'kita',e:'👏',t:'Klatsch-Rhythmus',d:'Das Muster nachklatschen',th:'<p>Hör das Muster und tippe es auf die große Fläche nach, in demselben Tempo. Kurze Töne gehen schnell, lange Töne brauchen Zeit.</p>',tip:'Klatscht Namen: „Mi-cha“, „Lu-ka“, „Schoko-la-de“. Jede Silbe ein Klatscher. Das ist schon Rhythmus.',g:['tapEasy','tapEasy','tapEasy']},
 /* ── Schulkind ── */
 {id:'s1',s:'schule',e:'🎼',t:'Das Notensystem',d:'Fünf Linien und ein Schlüssel',th:'<p>Noten wohnen auf <b>fünf Linien</b>. Wir zählen sie von <b>unten nach oben</b>. Am Anfang steht der <b>Violinschlüssel</b>. Je höher die Note sitzt, desto höher klingt der Ton.</p>',tip:'Zeichnet zusammen fünf Linien auf Papier und setzt Münzen als Noten darauf: hoch, tief, in der Mitte.',st:[st('Wie viele Linien hat das Notensystem?','5',['4','6','3'],'Das Notensystem hat fünf Linien.'),st('Von welcher Seite zählt man die Linien?','Von unten',['Von oben','Von links','Von der Mitte'],'Man zählt von unten nach oben.'),st('Wie heißt das Zeichen am Anfang der Zeile bei der Geige?','Violinschlüssel',['Bassschlüssel','Hausschlüssel','Taktstrich'],'Der Violinschlüssel steht bei hohen Instrumenten wie der Geige.'),st('Wie klingt eine Note, die höher im System sitzt?','Höher',['Tiefer','Lauter','Leiser'],'Je höher die Note sitzt, desto höher klingt sie.')],g:[]},
 {id:'s2',s:'schule',e:'🔤',t:'Notennamen C bis H',d:'Das Musik-Alphabet',th:'<p>Die Töne heißen <b>C D E F G A H</b>. Danach beginnt es wieder bei C, nur höher. Das H gibt es nur in Deutschland, im Englischen heißt es B.</p><p>Tipp: Die Linien von unten nach oben heißen <b>E G H D F</b>.</p>',tip:'Legt die Buchstaben C bis H als Karten und singt sie auf- und abwärts. Wer findet das G am schnellsten?',g:['noteK','noteK','noteK','noteK','noteK']},
 {id:'s3',s:'schule',e:'🥁',t:'Notenwerte',d:'Ganze, halbe, Viertel, Achtel',th:'<ul><li>Ganze Note: 4 Schläge</li><li>Halbe Note: 2 Schläge</li><li>Viertelnote: 1 Schlag</li><li>Achtelnote: ein halber Schlag</li></ul><p>Der Schlag ist wie ein gleichmäßiger Herzschlag.</p>',tip:'Zählt „1 2 3 4“ und klatscht: eine ganze Note = ein Klatscher auf 1 und dann Pause bis 4. Viertel = jede Zahl ein Klatscher.',g:['dur','dur','dur','dur'],st:[st('Welche Note dauert am längsten?','Ganze Note',['Halbe Note','Viertelnote','Achtelnote'],'Die ganze Note dauert vier Schläge.')]},
 {id:'s4',s:'schule',e:'📏',t:'Takt und Taktstrich',d:'Musik in Päckchen',th:'<p>Senkrechte Striche teilen die Noten in <b>Takte</b>. Bei <b>4/4</b> passen vier Viertel in einen Takt. Der erste Schlag im Takt ist meist der stärkste.</p>',tip:'Marschiert im Takt und betont jede erste Zahl: „EINS zwei drei vier, EINS zwei drei vier“.',g:[],st:[st('Wie viele Viertel passen in einen 4/4-Takt?','4',['2','3','8'],'Bei 4/4 gibt es vier Viertel pro Takt.'),st('Was trennt zwei Takte?','Der Taktstrich',['Die Pause','Der Schlüssel','Der Punkt'],'Der Taktstrich ist ein senkrechter Strich.'),st('Welcher Schlag ist im Takt meist der stärkste?','Der erste',['Der zweite','Der dritte','Der vierte'],'Der erste Schlag im Takt wird meist betont.')]},
 {id:'s5',s:'schule',e:'👏',t:'Rhythmus nachklatschen',d:'Mit kurzen und langen Tönen',th:'<p>Jetzt sind auch <b>schnelle</b> Töne dabei. Hör zuerst gut zu, dann tippe das Muster nach. Schnelle Töne kommen doppelt so schnell hintereinander.</p>',tip:'Denkt euch Rhythmen mit Wörtern aus: „Ba-na-ne“ (kurz kurz lang). Eins lässt der andere nachklatschen.',g:['tapMid','tapMid','tapMid','tapMid']},
 {id:'s6',s:'schule',e:'🔊',t:'Laut und leise in Noten',d:'p, f und mehr',th:'<ul><li><b>p</b> (piano): leise</li><li><b>f</b> (forte): laut</li><li><b>mf</b> (mezzoforte): mittellaut</li><li><b>crescendo</b>: lauter werden</li><li><b>decrescendo</b>: leiser werden</li></ul>',tip:'Singt dasselbe Lied leise (p), laut (f) und dann immer lauter werdend (crescendo).',g:['loud','loud'],st:[st('Was bedeutet das Zeichen p?','leise',['laut','schnell','langsam'],'p steht für piano, das heißt leise.'),st('Was bedeutet f?','laut',['leise','kurz','hoch'],'f steht für forte, das heißt laut.'),st('Was bedeutet crescendo?','Immer lauter werden',['Immer leiser werden','Schneller werden','Aufhören'],'Crescendo heißt: Es wird lauter.')]},
 {id:'s7',s:'schule',e:'🪜',t:'Tonleiter hören',d:'Acht Töne nach oben',th:'<p>Eine <b>Tonleiter</b> ist eine Treppe aus Tönen. Die C-Dur-Tonleiter geht C D E F G A H C. Du hörst Töne und sagst, ob es hinauf oder hinunter geht.</p>',tip:'Singt „Do Re Mi Fa So La Si Do“ hinauf und hinunter. Mit der Hand eine Treppe in die Luft zeichnen.',g:['steps','dirS','steps','dirS','steps']},
 {id:'s8',s:'schule',e:'🎭',t:'Dur und Moll',d:'Hell oder dunkel',th:'<p>Ein Dreiklang aus drei Tönen kann <b>Dur</b> (hell, fröhlich) oder <b>Moll</b> (dunkel, traurig) klingen. Hör genau hin.</p>',tip:'Schaut gemeinsam Filmmusik an: Welche Szene hat Dur, welche Moll?',g:['mm','mm','mm','mm','mm']},
 /* ── Anfänger ── */
 {id:'e1',s:'erw',e:'🎼',t:'Noten lesen mit Vorzeichen',d:'♯ und ♭ erkennen',th:'<p>Ein <b>♯</b> hebt den Ton um einen Halbton an, ein <b>♭</b> senkt ihn. Im Namen: Cis, Des, Fis, B (= H♭).</p>',g:['note','noteA','noteA','note','noteA']},
 {id:'e2',s:'erw',e:'⏱',t:'Notenwerte und Punkt',d:'Dauer berechnen',th:'<p>Ein Punkt verlängert um die Hälfte: punktierte Halbe = 3 Schläge, punktierte Viertel = 1½.</p>',g:['dur','dur','dur','dur'],st:[st('Wie lang ist eine punktierte Halbe?','3 Schläge',['2 Schläge','4 Schläge','2,5 Schläge'],'2 + 1 = 3 Schläge.')]},
 {id:'e3',s:'erw',e:'↕',t:'Intervalle',d:'Abstände benennen',th:'<p>Man zählt den Anfangston mit: C–E ist eine Terz, C–G eine Quinte, C–C eine Oktave.</p>',g:['iv','iv','iv','iv','iv']},
 {id:'e4',s:'erw',e:'♯',t:'Dur und Vorzeichen',d:'Tonleiter und Tonarten',th:'<p>Dur-Muster: Ganz-Ganz-Halb-Ganz-Ganz-Ganz-Halb. Kreuz-Reihenfolge: F C G D A E H. Quintenzirkel aufwärts: G (1♯), D (2♯), A (3♯), E (4♯).</p>',g:['sig','sig','sig','sig'],st:[st('Welche Schrittfolge hat eine Dur-Tonleiter?','G-G-H-G-G-G-H',['G-H-G-G-H-G-G','H-G-G-G-H-G-G','G-G-G-H-G-G-H'],'Dur: Ganz, Ganz, Halb, Ganz, Ganz, Ganz, Halb.')]},
 {id:'e5',s:'erw',e:'🎹',t:'Dreiklänge hören',d:'Dur oder Moll',th:'<p>Grundton, Terz, Quinte. Große Terz (4 Halbtöne) = Dur, kleine Terz (3 Halbtöne) = Moll.</p>',g:['triad','triad','triad','triad','triad']},
 {id:'e6',s:'erw',e:'🅰',t:'Moll-Formen',d:'Natürlich, harmonisch, melodisch',th:'<p>a-Moll: natürlich A H C D E F G A; harmonisch mit G♯; melodisch aufwärts mit F♯ und G♯, abwärts natürlich.</p>',g:[],st:[st('Welcher Ton wird in harmonisch Moll erhöht?','Die siebte Stufe',['Die zweite Stufe','Die vierte Stufe','Die dritte Stufe'],'Harmonisch Moll hat eine erhöhte siebte Stufe.'),st('Welche Vorzeichen hat a-Moll?','Keine',['Ein ♯','Ein ♭','Zwei ♯'],'a-Moll hat dieselben Vorzeichen wie C-Dur, nämlich keine.'),st('Wie ist die melodische Moll-Tonleiter abwärts?','Wie natürliches Moll',['Wie Dur','Wie harmonisches Moll','Gar nicht'],'Abwärts spielt man sie wie natürliches Moll.')]}
,
 /* ── Stilwelten ── */
 {id:'x1',s:'stil',e:'🌑',t:'Moll, Dur und Dunkelheit',d:'Wie Metal Spannung baut',th:'<p>Moll klingt dunkel, weil die dritte Stufe klein ist. Metal liebt Moll, weil es Druck und Schwere erzeugt. Ein Powerchord besteht nur aus Grundton und Quinte, ganz ohne Terz. Ohne Terz weiß das Ohr nicht, ob Dur oder Moll gemeint ist, und das Riff klingt stark und offen.</p>',g:['mm','mm','tri','tri','mode'],st:[st('Woraus besteht ein Powerchord?','Grundton und Quinte',['Grundton und Terz','Terz und Septime','Nur dem Grundton'],'Ohne Terz klingt er weder hell noch dunkel, nur kraftvoll.')]},
 {id:'x2',s:'stil',e:'🧭',t:'Kirchentonarten',d:'Dorisch, Mixolydisch, Phrygisch',th:'<p>Kirchentonarten sind Tonleitern auf den weißen Tasten, nur mit anderem Grundton:</p><ul><li><b>Dorisch</b> (D bis D): Moll mit großer Sexte, offen und keltisch</li><li><b>Mixolydisch</b> (G bis G): Dur mit kleiner Septime, rockig und volkstümlich</li><li><b>Phrygisch</b> (E bis E): Moll mit kleiner Sekunde, dunkel, spanisch und Metal</li></ul>',g:['mode','mode','modeD','modeM','modeP'],st:[st('Welche Tonart hat einen Halbton direkt über dem Grundton?','Phrygisch',['Dorisch','Mixolydisch','Dur'],'Phrygisch beginnt mit einem Halbtonschritt: E F G …'),st('Was ist Dorisch?','Moll mit großer Sexte',['Dur mit kleiner Septime','Moll mit kleiner Sekunde','Dur mit großer Terz'],'D-dorisch ist D E F G A H C D.')]},
 {id:'x3',s:'stil',e:'☘️',t:'Irische Tanzformen',d:'Jig, Reel und Co.',th:'<ul><li><b>Jig</b>: 6/8, sechs Achtel in zwei Dreiergruppen, springend</li><li><b>Slip Jig</b>: 9/8, drei Dreiergruppen</li><li><b>Reel</b>: 4/4, durchlaufende Achtel, schnell und flüssig</li><li><b>Hornpipe</b>: 4/4, schwerer und mit punktiertem Gefühl</li></ul><p>Im Geigenpult findest du „Haste to the Wedding“ und „St. Patrick’s Day“ (Jigs) und „Drowsy Maggie“ (Reel). Spiele sie zuerst langsam.</p>',g:['pulse','pulse','tapIrish','tapIrish','pulse'],st:[st('Wie viele Achtel hat ein Takt im Jig (6/8)?','6',['4','8','9'],'Sechs Achtel, in zwei Dreiergruppen.'),st('Welche Taktart hat ein Slip Jig?','9/8',['6/8','4/4','3/4'],'Drei Dreiergruppen ergeben 9/8.')]},
 {id:'x4',s:'stil',e:'✨',t:'Irische Verzierungen',d:'Cut, Tap, Roll',th:'<p>Irische Melodien leben von kleinen Verzierungen. Das gehört zum Stil, nicht zur Melodie:</p><ul><li><b>Cut</b>: ein ganz kurzer höherer Ton unmittelbar vor dem Hauptton</li><li><b>Tap</b>: ein kurzer tieferer Ton</li><li><b>Roll</b>: Hauptton, Cut, Hauptton, Tap, Hauptton, in einer Länge einer Viertel</li></ul><p>Auf der Geige setzt man sie mit den Fingern der linken Hand, der Bogen streicht sie oft einfach mit. Lerne erst die Melodie sauber, dann kommen die Verzierungen.</p>',g:[],st:[st('Was ist ein Cut?','Ein kurzer Ton vor dem Hauptton',['Eine lange Pause','Ein Bogenwechsel','Ein Sprung in die Oktave'],'Ein Cut ist eine sehr kurze Nachbarnote.'),st('Was sollte zuerst sitzen?','Die Melodie ohne Verzierung',['Alle Verzierungen','Das höchste Tempo','Die Doppelgriffe'],'Erst Melodie sauber, dann Verzierungen.'),st('Welche Hand setzt die Verzierungen meist auf der Geige?','Die linke Hand',['Die rechte Hand','Beide gleich','Die Füße'],'Die Finger der linken Hand erzeugen die schnellen Töne.')]},
 {id:'x5',s:'stil',e:'🇸🇪',t:'Schwedische Polska',d:'Drei Schläge, ungleich lang',th:'<p>Die Polska steht im Dreivierteltakt, fühlt sich aber anders an als ein Walzer: Die Schläge sind oft ungleich lang, und die Betonung wandert im Takt. Typisch sind Moll oder Dorisch und das Spiel auf Fiedel oder Nyckelharpa.</p><p>Im Geigenpult gibt es eine Polska-Übung im Stil (kein echtes Volkslied).</p>',g:['pulse','pulse','pulse','modeD','modeD'],st:[st('Welche Taktart hat die Polska?','3/4',['6/8','4/4','9/8'],'Sie steht im Dreivierteltakt.'),st('Was spielt man in Schweden gern zur Polska?','Nyckelharpa oder Fiedel',['Dudelsack','Banjo','Orgel'],'Die Nyckelharpa ist die schwedische Schlüsselfiedel.')]},
 {id:'x6',s:'stil',e:'🤘',t:'Galopp und Gitarrenrhythmen',d:'Schnelle Achtel und Sechzehntel',th:'<p>Der <b>Galopp</b> ist ein Metal-Klassiker: ein Achtel und zwei Sechzehntel, immer wieder. Auch auf der Geige geht er gut: Übe ihn erst mit leeren Saiten, dann mit Tönen. Klatsche ihn nach, bevor du ihn spielst.</p>',g:['gallop','gallop','gallop'],st:[st('Aus welchen Werten besteht der Galopp?','Ein Achtel, zwei Sechzehntel',['Zwei Viertel','Drei Achtel','Eine Halbe'],'Lang, kurz, kurz, immer wieder.')]},
 {id:'x7',s:'stil',e:'😈',t:'Tritonus und Spannung',d:'Der Teufel in der Musik',th:'<p>Der <b>Tritonus</b> hat sechs Halbtöne und teilt die Oktave in der Mitte. Er klingt unruhig und will sich auflösen. In Metal und Filmmusik schafft er Bedrohung. Die <b>reine Quinte</b> dagegen (sieben Halbtöne) klingt offen und stabil.</p>',g:['tri','tri','tri','tri','tri']},

 /* ── Musiker-Wissen ── */
 {id:"m1",s:'meister',e:"⭕",t:"Quintenzirkel",d:"Tonarten ordnen",th:"<p>Der <b>Quintenzirkel</b> ordnet die Tonarten im Abstand einer Quinte (7 Halbtöne). Von C-Dur aus gehst du eine Quinte nach oben und bekommst bei jedem Schritt ein <b>Kreuz</b> mehr:</p><ul><li>C (0) – G (1♯) – D (2♯) – A (3♯) – E (4♯) – H (5♯) – Fis (6♯)</li><li>Die Kreuze kommen in dieser Reihenfolge: <b>Fis, Cis, Gis, Dis, Ais, Eis, His</b>.</li></ul><p>Geht es eine Quinte nach unten (oder eine Quarte hoch), kommt ein <b>B</b> dazu:</p><ul><li>C – F (1♭) – B (2♭) – Es (3♭) – As (4♭) – Des (5♭)</li><li>Reihenfolge der B: <b>B, Es, As, Des, Ges, Ces, Fes</b>.</li></ul>",tip:"Merke: Das letzte Kreuz ist der Leitton. Ein halber Ton darunter liegt der Grundton der Dur-Tonart. Bei D-Dur ist das letzte Kreuz Cis, also ist D der Ton darüber.",st:[st("Wie viele Vorzeichen hat G-Dur?","1 Kreuz (Fis)",["1 B", "2 Kreuze", "keine"],"Von C eine Quinte hoch: G-Dur hat ein Kreuz, Fis."),st("Welche Tonart hat zwei Kreuze: Fis und Cis?","D-Dur",["A-Dur", "G-Dur", "B-Dur"],"D-Dur hat Fis und Cis."),st("Welche Dur-Tonart hat ein B als einziges Vorzeichen?","F-Dur",["G-Dur", "B-Dur", "Es-Dur"],"Eine Quinte unter C liegt F. F-Dur hat ein B."),st("Welches Kreuz kommt als erstes dazu?","Fis",["Cis", "Gis", "Eis"],"Die Reihenfolge beginnt mit Fis."),st("Welche Tonart hat zwei B (B und Es)?","B-Dur",["F-Dur", "Es-Dur", "As-Dur"],"B-Dur hat B und Es."),st("Eine Quinte über D liegt …","A",["G", "E", "H"],"D bis A sind sieben Halbtöne.")]},
 {id:"m2",s:'meister',e:"👪",t:"Paralleltonarten",d:"Dur und Moll verwandt",th:"<p>Zu jeder Dur-Tonart gibt es eine <b>Paralleltonart</b> in Moll mit denselben Vorzeichen. Der Grundton liegt eine <b>kleine Terz (3 Halbtöne) tiefer</b>.</p><ul><li>C-Dur ↔ a-Moll</li><li>G-Dur ↔ e-Moll</li><li>D-Dur ↔ h-Moll</li><li>F-Dur ↔ d-Moll</li></ul><p>Die <b>gleichnamige</b> Tonart ist etwas anderes: sie hat denselben Grundton (C-Dur und c-Moll), aber andere Vorzeichen.</p>",tip:"Viele Lieder wechseln zwischen Dur und seiner Parallele. Du erkennst es, weil sich nur der Grundton verschiebt, nicht die Töne.",st:[st("Paralleltonart von C-Dur?","a-Moll",["c-Moll", "e-Moll", "d-Moll"],"Eine kleine Terz unter C liegt A."),st("Paralleltonart von G-Dur?","e-Moll",["g-Moll", "a-Moll", "h-Moll"],"Eine kleine Terz unter G ist E."),st("Paralleltonart von h-Moll?","D-Dur",["H-Dur", "G-Dur", "A-Dur"],"Eine kleine Terz über H ist D."),st("Gleichnamige Tonart von D-Dur?","d-Moll",["h-Moll", "F-Dur", "e-Moll"],"Gleichnamig heißt: gleicher Grundton."),st("Wie weit liegt die Parallele unter der Dur-Tonart?","eine kleine Terz",["eine Quinte", "eine Sekunde", "eine Quarte"],"3 Halbtöne, eine kleine Terz.")]},
 {id:"m3",s:'meister',e:"🏗",t:"Stufenakkorde",d:"Alle Akkorde einer Tonart",th:"<p>Baut man auf jeder Stufe der Dur-Tonleiter einen Dreiklang mit den Tönen der Tonleiter, entstehen die <b>Stufenakkorde</b>:</p><table class=\"tbl\"><tr><th>Stufe</th><th>I</th><th>II</th><th>III</th><th>IV</th><th>V</th><th>VI</th><th>VII</th></tr><tr><td>Art</td><td>Dur</td><td>Moll</td><td>Moll</td><td>Dur</td><td>Dur</td><td>Moll</td><td>vermindert</td></tr><tr><td>C-Dur</td><td>C</td><td>Dm</td><td>Em</td><td>F</td><td>G</td><td>Am</td><td>Hdim</td></tr><tr><td>G-Dur</td><td>G</td><td>Am</td><td>Hm</td><td>C</td><td>D</td><td>Em</td><td>Fis dim</td></tr></table><p>Fast alle Pop- und Folksongs bestehen nur aus I, IV, V und VI. So findest du in jeder Tonart sofort passende Akkorde.</p>",tip:"Der Trick für die Praxis: Lerne die Zahlen, nicht die Namen. Dann kannst du jedes Lied in jede Tonart schieben.",st:[st("Welcher Akkord steht in G-Dur auf der IV. Stufe?","C",["D", "Em", "Am"],"G A H C: die vierte Stufe ist C."),st("Welcher Akkord steht in D-Dur auf der V. Stufe?","A",["G", "E", "Hm"],"D E Fis G A: die fünfte Stufe ist A."),st("Welche Stufe ist in Dur vermindert?","die VII.",["die II.", "die IV.", "die VI."],"Auf der siebten Stufe entsteht ein verminderter Dreiklang."),st("Welcher Akkord steht in C-Dur auf der VI. Stufe?","Am",["Dm", "Em", "F"],"C D E F G A: die sechste Stufe ist A, der Akkord Moll."),st("Welche Akkorde bilden I – IV – V in D-Dur?","D, G, A",["D, E, A", "D, G, H", "D, F, A"],"D, G (IV) und A (V)."),st("Welche Stufenakkorde sind in Dur Moll?","II, III und VI",["I, IV und V", "nur VII", "I, III und V"],"Moll sind II, III und VI.")]},
 {id:"m4",s:'meister',e:"🔁",t:"Kadenzen",d:"Spannung und Auflösung",th:"<p>Akkorde haben Funktionen: <b>Tonika (T)</b> ist das Zuhause, <b>Subdominante (S)</b> entfernt sich sanft, <b>Dominante (D)</b> erzeugt Spannung, die zur Tonika zurück will.</p><ul><li><b>Ganzschluss</b>: V → I. Klingt, als wäre der Satz zu Ende.</li><li><b>Plagalschluss</b>: IV → I. Der „Amen“-Schluss.</li><li><b>Halbschluss</b>: endet auf V. Es klingt wie ein Komma, nicht wie ein Punkt.</li><li><b>Trugschluss</b>: V → VI. Man erwartet I und bekommt Moll, das überrascht.</li></ul><p>Die klassische Kadenz ist <b>I – IV – V – I</b>.</p>",tip:"Hör dir G – C – D – G auf der Gitarre an und ersetze den Schluss durch Em. Das ist der Trugschluss.",st:[st("Was ist ein Ganzschluss?","V → I",["IV → I", "I → V", "V → VI"],"Dominante zur Tonika."),st("Welcher Schluss heißt „Amen-Schluss“?","IV → I",["V → I", "V → VI", "II → V"],"Der Plagalschluss."),st("Was ist ein Trugschluss?","V → VI",["IV → I", "V → I", "I → IV"],"Man erwartet I und hört VI."),st("Welche Funktion hat die V. Stufe?","Dominante",["Tonika", "Subdominante", "Parallele"],"Die Dominante strebt zur Tonika."),st("Wie endet ein Halbschluss?","auf der V. Stufe",["auf der I. Stufe", "auf der IV. Stufe", "auf der VII. Stufe"],"Er bleibt offen auf der Dominante."),st("Welche Funktion hat die IV. Stufe?","Subdominante",["Dominante", "Tonika", "Leitton"],"IV ist die Subdominante.")]},
 {id:"m5",s:'meister',e:"7️⃣",t:"Septakkorde",d:"Vierklänge",th:"<p>Ein Septakkord fügt dem Dreiklang eine vierte Note hinzu, die <b>Septime</b>:</p><table class=\"tbl\"><tr><th>Name</th><th>Aufbau</th><th>Beispiel</th></tr><tr><td>Dominantsept (7)</td><td>Dur + kleine Septime</td><td>G7: G H D F</td></tr><tr><td>Maj7</td><td>Dur + große Septime</td><td>Cmaj7: C E G H</td></tr><tr><td>m7</td><td>Moll + kleine Septime</td><td>Am7: A C E G</td></tr><tr><td>m7♭5</td><td>vermindert + kleine Septime</td><td>Hm7♭5: H D F A</td></tr></table><p>Der Dominantseptakkord steht auf der V. Stufe und will zur Tonika. Maj7 klingt weich, m7 sanft traurig.</p>",tip:"Spiele G7 auf der Gitarre und löse nach C auf. Das F in G7 will einen Halbton nach unten zum E.",st:[st("Welche Töne hat G7?","G H D F",["G H D Fis", "G B D F", "G H D A"],"G-Dur plus kleine Septime F."),st("Welche Töne hat Cmaj7?","C E G H",["C E G B", "C Es G H", "C E G A"],"C-Dur plus große Septime H."),st("Welche Töne hat Am7?","A C E G",["A C E Gis", "A Cis E G", "A C E H"],"A-Moll plus kleine Septime G."),st("Auf welcher Stufe steht der Dominantseptakkord?","auf der V.",["auf der I.", "auf der IV.", "auf der II."],"V7 ist der Dominantseptakkord."),st("Wie weit ist die große Septime vom Grundton entfernt?","11 Halbtöne",["10 Halbtöne", "9 Halbtöne", "12 Halbtöne"],"Ein Halbton unter der Oktave."),st("Was unterscheidet Cmaj7 von C7?","die Septime: H statt B",["die Terz", "die Quinte", "nichts"],"C7 hat B (kleine Septime), Cmaj7 hat H.")]},
 {id:"m6",s:'meister',e:"🌫",t:"Sus, Add9 und Erweiterungen",d:"Farben für Akkorde",th:"<ul><li><b>sus2</b>: die Terz wird durch die Sekunde ersetzt (Csus2: C D G).</li><li><b>sus4</b>: die Terz wird durch die Quarte ersetzt (Csus4: C F G).</li><li><b>add9</b>: Dreiklang plus die 9 (Sekunde, eine Oktave höher), aber ohne Septime (Cadd9: C E G D).</li><li><b>9</b>: Septakkord plus 9 (C9: C E G B D).</li></ul><p>Sus-Akkorde klingen schwebend, weil man die Terz nicht hört und deshalb nicht weiß, ob Dur oder Moll.</p>",tip:"Probiere in Songs, die du kennst, Cadd9 statt C: der Akkord klingt offener.",st:[st("Welche Töne hat Csus4?","C F G",["C D G", "C E G", "C F A"],"Quarte statt Terz."),st("Welche Töne hat Csus2?","C D G",["C F G", "C E G", "C D A"],"Sekunde statt Terz."),st("Was unterscheidet Cadd9 von C9?","C9 hat zusätzlich die Septime",["nichts", "Cadd9 hat die Septime", "C9 hat keine Quinte"],"Add9 hat keine Septime."),st("Warum klingen sus-Akkorde schwebend?","die Terz fehlt",["sie sind lauter", "sie haben zwei Grundtöne", "sie haben keine Quinte"],"Ohne Terz hört man weder Dur noch Moll."),st("Welche Töne hat Cadd9?","C E G D",["C E G H", "C E G B", "C F G D"],"Dreiklang plus 9.")]},
 {id:"m7",s:'meister',e:"📏",t:"Intervalle in Halbtönen",d:"Der Maßstab der Musik",th:"<table class=\"tbl\"><tr><th>Intervall</th><th>Halbtöne</th></tr><tr><td>kleine Sekunde</td><td>1</td></tr><tr><td>große Sekunde</td><td>2</td></tr><tr><td>kleine Terz</td><td>3</td></tr><tr><td>große Terz</td><td>4</td></tr><tr><td>reine Quarte</td><td>5</td></tr><tr><td>Tritonus</td><td>6</td></tr><tr><td>reine Quinte</td><td>7</td></tr><tr><td>kleine Sexte</td><td>8</td></tr><tr><td>große Sexte</td><td>9</td></tr><tr><td>kleine Septime</td><td>10</td></tr><tr><td>große Septime</td><td>11</td></tr><tr><td>Oktave</td><td>12</td></tr></table><p>Mit dieser Tabelle baust du jeden Akkord und jede Tonleiter selbst.</p>",tip:"Dur-Dreiklang = große Terz + kleine Terz (4 + 3). Moll-Dreiklang = kleine Terz + große Terz (3 + 4).",st:[st("Wie viele Halbtöne hat eine Quinte?","7",["5", "6", "8"],"Reine Quinte: 7 Halbtöne."),st("Wie viele Halbtöne hat eine große Terz?","4",["3", "5", "2"],"Große Terz: 4 Halbtöne."),st("Welches Intervall hat 6 Halbtöne?","Tritonus",["Quarte", "Quinte", "Sexte"],"6 Halbtöne teilen die Oktave in der Mitte."),st("Wie viele Halbtöne hat eine kleine Septime?","10",["11", "9", "12"],"Ein Ganzton unter der Oktave."),st("Aus welchen Terzen besteht ein Moll-Dreiklang?","kleine Terz, dann große Terz",["große Terz, dann kleine Terz", "zwei große Terzen", "zwei kleine Terzen"],"3 + 4 Halbtöne."),st("Wie viele Halbtöne hat die reine Quarte?","5",["4", "6", "7"],"Reine Quarte: 5 Halbtöne.")]},
 {id:"m8",s:'meister',e:"🎸",t:"Pentatonik und Blues",d:"Die Solo-Skalen",th:"<ul><li><b>Moll-Pentatonik</b>: 1 – ♭3 – 4 – 5 – ♭7. In A: A C D E G.</li><li><b>Dur-Pentatonik</b>: 1 – 2 – 3 – 5 – 6. In C: C D E G A.</li><li><b>Blues-Skala</b>: Moll-Pentatonik plus die <b>Blue Note</b> ♭5. In A: A C D Es E G.</li></ul><p>Die <b>12-Takt-Bluesform</b> in Stufen: I I I I | IV IV I I | V IV I V.</p><p>Die Moll-Pentatonik passt auf Moll-Akkorde und über Dur-Blues-Akkorde hinweg, weil sie „schmutzig“ klingt. Genau das ist Blues und Rock.</p>",tip:"Blue Note: ein Ton, der sich reibt, weil er zwischen Moll und Dur liegt. Nicht lange darauf stehenbleiben, sondern durchgehen.",st:[st("Wie viele Töne hat eine Pentatonik?","5",["6", "7", "4"],"Penta heißt fünf."),st("Welche Töne hat die A-Moll-Pentatonik?","A C D E G",["A H C E G", "A C D F G", "A H D E G"],"1, ♭3, 4, 5, ♭7."),st("Welcher Ton ist die Blue Note in der Blues-Skala?","die ♭5",["die 2", "die 6", "die ♭3"],"Die verminderte Quinte kommt zur Moll-Pentatonik hinzu."),st("Wie lang ist die Bluesform?","12 Takte",["8 Takte", "16 Takte", "10 Takte"],"Der 12-Takt-Blues."),st("Welche Stufe kommt im 12-Takt-Blues ab Takt 5?","IV",["V", "II", "VI"],"Takt 5 und 6 stehen auf der IV. Stufe."),st("Welche Töne hat die C-Dur-Pentatonik?","C D E G A",["C D F G A", "C E F G H", "C D E F G"],"1, 2, 3, 5, 6.")]},
 {id:"m9",s:'meister',e:"⏳",t:"Rhythmus für Fortgeschrittene",d:"Synkopen, Triolen, ungerade Takte",th:"<ul><li><b>Synkope</b>: Betonung auf einer unbetonten Zeit, zum Beispiel auf dem „und“. Das gibt Groove.</li><li><b>Triole</b>: drei Noten auf die Zeit von zwei, zählbar als „Tri-o-le“.</li><li><b>6/8</b>: zwei Dreiergruppen („1-2-3, 4-5-6“) wie beim Jig. <b>3/4</b> hat dagegen drei Schläge (Walzer).</li><li><b>Ungerade Takte</b> wie 5/4 oder 7/8 teilt man in Gruppen, zum Beispiel 7/8 = 2 + 2 + 3. Die tragen viele Prog- und Metal-Riffs.</li></ul>",tip:"Zähle 7/8 laut: 1-2, 1-2, 1-2-3. Klopfe dabei die Betonungen auf die erste Zahl jeder Gruppe.",st:[st("Was ist eine Synkope?","Betonung auf einer unbetonten Zeit",["ein sehr langer Ton", "ein Taktwechsel", "ein Atemzeichen"],"Die Betonung rutscht weg vom Schlag."),st("Wie viele Noten hat eine Triole pro Schlag?","3",["2", "4", "6"],"Drei Noten in der Zeit von zwei."),st("Wie wird 6/8 gezählt?","zwei Dreiergruppen",["drei Zweiergruppen", "sechs Schläge", "vier Gruppen"],"Typisch für Jigs."),st("Wie wird 7/8 häufig gruppiert?","2 + 2 + 3",["4 + 4", "1 + 6", "5 + 2"],"Auch 3 + 2 + 2 oder 2 + 3 + 2 sind üblich."),st("Wie viele Viertel hat ein 3/4-Takt?","3",["4", "6", "2"],"Drei Viertelnoten."),st("Wie viele Achtel hat ein 6/8-Takt?","6",["3", "8", "4"],"Sechs Achtel.")]},
 {id:"m10",s:'meister',e:"🎚",t:"Transponieren und Kapodaster",d:"Tonarten verschieben",th:"<p>Transponieren heißt, alle Töne um denselben Abstand zu verschieben. In Stufen bleibt alles gleich: I-IV-V in C (C F G) wird in D zu D G A.</p><p>Mit dem <b>Kapodaster</b> auf Bund <i>n</i> klingen die gleichen Griffe <i>n</i> Halbtöne höher:</p><ul><li>Capo 2 mit G-Griffen → A klingt</li><li>Capo 3 mit C-Griffen → Es klingt</li><li>Capo 5 mit E-Griffen → A klingt</li></ul><p>So bringst du Lieder in deine Stimmlage, ohne neue Griffe zu lernen.</p>",tip:"Zähle vom Griff-Namen aus Halbtöne nach oben. G, Gis, A: Capo 2 klingt A.",st:[st("Welcher Akkord erklingt bei Capo 2 und G-Griff?","A",["Gis", "H", "Fis"],"G + 2 Halbtöne = A."),st("Welcher Akkord erklingt bei Capo 3 und C-Griff?","Es",["D", "E", "F"],"C + 3 Halbtöne = Es."),st("Wie wird C – F – G nach D transponiert?","D – G – A",["D – F – G", "D – G – H", "E – A – H"],"Alles um 2 Halbtöne."),st("Um wie viele Halbtöne hebt ein Capo im 4. Bund an?","4",["2", "3", "5"],"Ein Halbton pro Bund."),st("Welcher Akkord erklingt bei Capo 5 und E-Griff?","A",["G", "H", "C"],"E + 5 Halbtöne = A.")]},
 {id:"m11",s:'meister',e:"🎭",t:"Vortragszeichen",d:"Wie man etwas spielt",th:"<table class=\"tbl\"><tr><th>Zeichen</th><th>Bedeutung</th></tr><tr><td>p, mp, mf, f</td><td>leise, halbleise, halblaut, laut</td></tr><tr><td>crescendo</td><td>lauter werden</td></tr><tr><td>decrescendo, diminuendo</td><td>leiser werden</td></tr><tr><td>legato</td><td>gebunden</td></tr><tr><td>staccato</td><td>kurz, abgesetzt</td></tr><tr><td>ritardando (rit.)</td><td>langsamer werdend</td></tr><tr><td>a tempo</td><td>zurück zum Grundtempo</td></tr><tr><td>fermate 𝄐</td><td>Ton halten, länger als notiert</td></tr><tr><td>allegro, andante, adagio</td><td>schnell, gehend, langsam</td></tr></table>",tip:"Musik wird erst durch Dynamik lebendig. Spiele ein Lied einmal ganz gleichmäßig und einmal mit crescendo und ritardando.",st:[st("Was bedeutet crescendo?","lauter werden",["leiser werden", "schneller werden", "Pause"],"Cresc. heißt anwachsend."),st("Was bedeutet staccato?","kurz und abgesetzt",["gebunden", "laut", "langsam"],"Staccato: abgestoßen."),st("Was bedeutet ritardando?","langsamer werdend",["lauter werdend", "kurz", "gebunden"],"Rit. ist verzögern."),st("Was bedeutet a tempo?","zurück zum Grundtempo",["schneller", "ganz langsam", "Ton halten"],"Nach einem Ritardando."),st("Welches Tempo ist adagio?","langsam",["schnell", "mittel", "sehr schnell"],"Adagio: langsam, ruhig."),st("Was bedeutet legato?","gebunden",["kurz", "laut", "leise"],"Töne fließen ineinander.")]},
 {id:"m12",s:'meister',e:"🧩",t:"Form: Aus Tönen wird ein Stück",d:"Strophe, Refrain, AABB",th:"<ul><li><b>Intro, Strophe, Refrain, Bridge, Outro</b>: die Bausteine eines Pop- oder Rocksongs. Die Bridge bringt nach zwei Refrains etwas Neues.</li><li><b>AABA</b>: Standardform vieler Jazz-Stücke.</li><li><b>AABB</b>: irische und schwedische Tänze haben meist zwei Teile (A und B), die je wiederholt werden.</li><li>Vier Takte bilden ein Motiv, acht eine <b>Periode</b> aus Frage und Antwort.</li></ul>",tip:"Zähle beim Hören die Takte mit. Schon beim dritten Hören kennst du die Form auswendig.",st:[st("Wie viele Teile hat ein typischer Jig oder Reel?","zwei (A und B), jeweils wiederholt",["einen", "vier", "keine festen"],"AABB ist die Regel."),st("Was ist eine Bridge?","ein neuer Teil nach zwei Refrains",["das Intro", "die zweite Strophe", "ein Akkord"],"Sie sorgt für Abwechslung."),st("Wofür steht AABA?","zwei gleiche Teile, ein Kontrast, dann der erste Teil",["vier verschiedene Teile", "nur ein Teil", "drei Kontraste"],"Typisch für Songs im Standardformat."),st("Wie viele Takte hat eine Periode normalerweise?","8",["3", "5", "7"],"Vier Takte Frage, vier Antwort."),st("Was folgt im Pop-Song oft auf die Strophe?","der Refrain",["das Intro", "die Fermate", "das Solo am Ende"],"Strophe, Refrain im Wechsel.")]},
 {id:"m13",s:'meister',e:"👂",t:"Gehörbildung: Intervalle erkennen",d:"Mit Merkliedern",th:"<p>Intervalle erkennt man am besten mit bekannten Melodien. Der erste Sprung zählt:</p><ul><li><b>Kleine Sekunde aufwärts</b>: Thema aus „Der weiße Hai“</li><li><b>Reine Quinte aufwärts</b>: „Morgen kommt der Weihnachtsmann“</li><li><b>Große Sexte aufwärts</b>: „My Bonnie lies over the ocean“</li><li><b>Tritonus aufwärts</b>: „Maria“ aus der West Side Story</li><li><b>Oktave aufwärts</b>: „Somewhere over the Rainbow“</li></ul><p>Im Bereich „Theorie“ kannst du Intervalle und Akkorde auch hören und raten.</p>",tip:"Singe das Intervall, bevor du es spielst. Wer singen kann, hört auch besser.",st:[st("Welches Intervall beginnt „Somewhere over the Rainbow“?","Oktave",["Quinte", "Terz", "Sexte"],"Der erste Sprung ist eine Oktave."),st("Welches Intervall beginnt „Morgen kommt der Weihnachtsmann“?","reine Quinte",["Oktave", "Terz", "Quarte"],"C auf G."),st("Welches Intervall beginnt „My Bonnie“?","große Sexte",["Quarte", "Oktave", "Terz"],"Aufwärts, neun Halbtöne."),st("Welches Intervall ist „Maria“ (West Side Story)?","Tritonus",["Quinte", "Oktave", "Terz"],"Sechs Halbtöne."),st("Welches Intervall kommt im „Weißen Hai“-Thema vor?","kleine Sekunde",["Quinte", "Oktave", "große Terz"],"Es wechselt zwischen zwei Nachbartönen im Halbton.")]},
 {id:"m14",s:'meister',e:"🏁",t:"Meisterhaft üben",d:"Improvisieren und Lernen",th:"<ul><li><b>Langsam anfangen</b>: Was du langsam nicht sauber kannst, wird schnell nicht besser.</li><li><b>Metronom</b>: erst 60 %, dann in Schritten von 5 BPM steigern.</li><li><b>Schleifen</b>: nur die schwierigsten zwei Takte wiederholen, nicht das ganze Stück.</li><li><b>Kurz und täglich</b>: zweimal 15 Minuten schlagen eine Stunde am Wochenende.</li><li><b>Improvisieren</b>: wähle eine Pentatonik, spiele ein Motiv, wiederhole es, ändere es leicht. Lass Pausen.</li><li><b>Aufnehmen</b>: Hör dir an, was du wirklich spielst.</li></ul>",tip:"Nimm dir pro Woche ein Stück vor, das ein bisschen zu schwer ist. Das bringt dich mehr weiter als zehn leichte.",st:[st("Wie übt man eine schwierige Stelle am besten?","in einer Schleife und langsam",["möglichst schnell", "gar nicht", "nur im Ganzen"],"Kleine Stücke, langsam wiederholen."),st("Wie steigert man das Tempo?","in kleinen Schritten",["sofort Endtempo", "gar nicht", "nur einmal pro Monat"],"5 BPM sind oft ein guter Schritt."),st("Was hilft beim Improvisieren am meisten?","ein Motiv wiederholen und variieren",["möglichst viele Töne", "nie Pausen", "nur schnelle Läufe"],"Wiederholung gibt dem Solo Halt."),st("Was bringt mehr?","kurz und jeden Tag",["einmal im Monat sehr lang", "nur vor dem Auftritt", "gar nichts"],"Regelmäßigkeit schlägt Dauer."),st("Warum nimmt man sich auf?","man hört, was man wirklich spielt",["weil es lauter klingt", "um schneller zu werden", "um Strom zu sparen"],"Das Ohr beim Spielen täuscht.")]},
];
function lesById(id){return LES.find(function(l){return l.id===id})}

/* ── Fortschritt ── */
var PR;
function loadP(){PR=MK.get('theory',{});PR.xp=PR.xp||0;PR.stars=PR.stars||{};PR.days=PR.days||{}}
function saveP(){MK.set('theory',PR)}
function lvl(){return Math.floor(Math.sqrt(PR.xp/30))+1}
function streak(){var d=new Date(),n=0;d=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(!PR.days[MK.day(d)])d.setDate(d.getDate()-1);while(PR.days[MK.day(d)]){n++;d.setDate(d.getDate()-1)}return n}
function starsHtml(n){return '<span class="stars" aria-label="'+n+' von 3 Sternen">'+[1,2,3].map(function(i){return i<=n?'★':'<span class="off">★</span>'}).join('')+'</span>'}
var stage=MK.profile().stage||'erw';
function render(){
  var p=MK.profile(),a=30*(lvl()-1)*(lvl()-1),b=30*lvl()*lvl();
  $('#who').textContent=p.emoji+' '+p.name+' · Level '+lvl();
  $('#xp-t').textContent=PR.xp+' XP';$('#xp-fill').style.width=Math.round((PR.xp-a)/(b-a)*100)+'%';
  var tot=0,dn=0;LES.forEach(function(l){var s=PR.stars[l.id]||0;tot+=s;if(s>0)dn++});
  $('#st-stars').textContent=tot;$('#st-done').textContent=dn+'/'+LES.length;$('#st-streak').textContent=streak();
  $('#tabs').innerHTML=Object.keys(STG).map(function(k){return '<button type="button" role="tab" data-s="'+k+'" aria-selected="'+(k===stage)+'"><b>'+STG[k].e+' '+STG[k].n+'</b><span>'+STG[k].sub+'</span></button>'}).join('');
  var l=$('#list');l.className='grid'+(stage==='kita'?' kid':'');
  document.body.classList.toggle('kid',stage==='kita');
  l.innerHTML=(stage==='kita'?'<button class="les" type="button" data-id="xylo"><span class="e">🎹</span><span class="t">Xylophon</span><span class="d">Spielen und Lieder nachspielen, mit leuchtenden Stäben</span></button>':'')+LES.filter(function(x){return x.s===stage}).map(function(x){
    return '<button class="les" type="button" data-id="'+x.id+'"><span class="e">'+x.e+'</span><span class="t">'+esc(x.t)+'</span><span class="d">'+esc(x.d)+'</span>'+starsHtml(PR.stars[x.id]||0)+'</button>';
  }).join('');
}
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b){stage=b.dataset.s;show('list');render()}});
$('#list').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.id==='xylo')openXylo();else openLesson(b.dataset.id)});
function show(w){['list','lesson','quiz','result','xylo'].forEach(function(id){$('#'+id).hidden=id!==w});$('#tabs').hidden=w!=='list';$('#prog').hidden=w==='quiz'}

/* ── Lektion und Quiz ── */
var cur=null,Q=null;
function openLesson(id){
  cur=lesById(id);show('lesson');
  $('#l-title').textContent=cur.e+' '+cur.t;$('#l-th').innerHTML=cur.th;
  $('#l-tip').hidden=!cur.tip;$('#l-tip').innerHTML=cur.tip?'<b>Für Eltern und Kinder:</b> '+esc(cur.tip):'';
  $('#l-say').hidden=!(CAN_SPEAK&&cur.s==='kita');
}
$('#l-close').addEventListener('click',function(){show('list');render()});
$('#l-say').addEventListener('click',function(){speak($('#l-th').textContent)});
$('#l-go').addEventListener('click',function(){startQuiz(cur)});
function mkQuiz(l,seed){
  var r=mkRng(seed),qs=[];
  (l.st||[]).forEach(function(f){qs.push(f(r))});
  (l.g||[]).forEach(function(n){qs.push(KG[n](r))});
  return shuffle(r,qs).slice(0,5);
}
function startQuiz(l){
  Q={l:l,qs:mkQuiz(l,Date.now()),i:0,right:0,ok:false,locked:false};
  show('quiz');showQ();
}
function showQ(){
  var q=Q.qs[Q.i],kid=Q.l.s==='kita';
  Q.locked=false;Q.ok=false;Q.taps=[];
  $('#q-head').textContent=Q.l.t+' · Frage '+(Q.i+1)+' von '+Q.qs.length;$('#q-bar').style.width=Math.round(Q.i/Q.qs.length*100)+'%';
  $('#q-emo').hidden=!q.emo;$('#q-emo').textContent=q.emo||'';
  $('#q-text').textContent=q.q;
  $('#q-play').hidden=!(q.ear||q.tap);$('#q-play').textContent=q.tap?'▶ Muster anhören':'▶ Anhören';
  $('#q-say').hidden=!(CAN_SPEAK&&kid);
  var sv=$('#q-staff');sv.hidden=!q.note;sv.innerHTML=q.note?staffSvg([q.note]):'';
  $('#q-tap').hidden=!q.tap;$('#q-opts').innerHTML='';
  if(q.tap){
    $('#q-blocks').innerHTML=q.tap.pat.map(function(d){return '<span style="flex:'+d+'">'+(d>=2?'ta-a':d>=1?'ta':'ti')+'</span>'}).join('');
    $('#q-tapst').textContent='Zuerst anhören, dann '+q.tap.pat.length+' Mal tippen.';
  }else{
    $('#q-opts').innerHTML=q.opts.map(function(o,i){return '<button class="btn" type="button" data-i="'+i+'">'+esc(o)+'</button>'}).join('');
  }
  $('#q-fb').hidden=true;$('#q-next').hidden=true;$('#q-retry').hidden=true;
  if(q.ear||q.tap)setTimeout(function(){try{$('#q-play').focus()}catch(e){}},0);
}
$('#q-play').addEventListener('click',function(){var q=Q.qs[Q.i];if(q.tap)playEar({rhythm:q.tap.pat,bpm:q.tap.bpm});else playEar(q.ear)});
$('#q-say').addEventListener('click',function(){speak(Q.qs[Q.i].q)});
function feedback(ok,why){
  var kid=Q.l.s==='kita',fb=$('#q-fb');
  fb.hidden=false;fb.className='fb '+(ok?'good':'bad');
  fb.textContent=(ok?(kid?'Super gemacht! 🎉 ':'Richtig. '):(kid?'Fast! Hör noch einmal genau hin. ':'Nicht ganz. '))+(why||'');
  var nb=$('#q-next');nb.hidden=false;nb.textContent=Q.i+1<Q.qs.length?'Weiter':'Fertig';
}
$('#q-opts').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b||Q.locked)return;
  Q.locked=true;var q=Q.qs[Q.i],i=+b.dataset.i,ok=i===q.a;if(ok)Q.right++;
  $$('#q-opts button').forEach(function(x,j){x.disabled=true;if(j===q.a)x.classList.add('right');else if(j===i)x.classList.add('wrong')});
  feedback(ok,q.why);$('#q-next').focus();
});
/* Klatsch-Aufgabe: Abstände zum Muster vergleichen, Gesamtversatz egal. */
function tapEval(pat,bpm,taps,tol){
  var beat=60000/bpm,exp=[],x=0;pat.forEach(function(d){exp.push(x*beat);x+=d});
  var off=0;taps.forEach(function(t,i){off+=t-exp[i]});off/=taps.length;
  var worst=0;taps.forEach(function(t,i){worst=Math.max(worst,Math.abs(t-off-exp[i]))});
  return worst<=tol*beat;
}
$('#q-pad').addEventListener('pointerdown',function(e){
  var q=Q&&Q.qs[Q.i];if(!q||!q.tap||Q.locked)return;
  e.preventDefault();var now=performance.now(),pad=$('#q-pad');
  try{thump(ac().currentTime)}catch(er){}
  pad.classList.add('hit');setTimeout(function(){pad.classList.remove('hit')},90);
  Q.taps.push(now);$('#q-tapst').textContent=Q.taps.length+' von '+q.tap.pat.length+' getippt.';
  if(Q.taps.length>=q.tap.pat.length){
    var ok=tapEval(q.tap.pat,q.tap.bpm,Q.taps,Q.l.s==='kita'?.5:.38);
    if(ok){Q.locked=true;Q.right++;feedback(true,'Dein Rhythmus passt.');$('#q-retry').hidden=true}
    else{Q.taps=[];feedback(false,'Das Muster stimmte noch nicht ganz. Hör es noch einmal an und versuche es gleich noch einmal.');$('#q-next').textContent='Überspringen';$('#q-retry').hidden=false}
  }
});
$('#q-retry').addEventListener('click',function(){Q.taps=[];$('#q-fb').hidden=true;$('#q-next').hidden=true;$('#q-retry').hidden=true;$('#q-tapst').textContent='Noch einmal: '+Q.qs[Q.i].tap.pat.length+' Mal tippen.'});
$('#q-next').addEventListener('click',function(){
  if(Q.i+1<Q.qs.length){Q.i++;showQ();return}
  finishQuiz();
});
$('#q-close').addEventListener('click',function(){show('list');render()});
function finishQuiz(){
  var n=Q.qs.length,r=Q.right,frac=r/n,stars=frac>=.99?3:frac>=.7?2:frac>=.4?1:0,id=Q.l.id,old=PR.stars[id]||0;
  var xp=Math.max(0,stars-old)*10+r*2;
  if(stars>old)PR.stars[id]=stars;
  PR.xp+=xp;PR.days[MK.day()]=1;saveP();
  show('result');
  $('#r-title').textContent=stars===3?'Perfekt! 🎉':stars>0?'Gut gemacht!':'Noch einmal versuchen';
  $('#r-stars').innerHTML=starsHtml(stars);
  $('#r-text').textContent=r+' von '+n+' richtig · +'+xp+' XP';
  render();
}
$('#r-again').addEventListener('click',function(){startQuiz(Q.l)});
$('#r-back').addEventListener('click',function(){show('list');render()});

loadP();render();show('list');
/* ── Xylophon (Entdecker) ── */
var XN=[['C',60],['D',62],['E',64],['F',65],['G',67],['A',69],['H',71],['C',72]],XCOL=['#d64545','#e57f2b','#c99a00','#3f9e55','#2f8fa8','#3a63c9','#7a4fc2','#d64545'];
/* Töne als Stab-Nummern 0 bis 7 (C D E F G A H C') */
var XSONGS=[
 {t:'Freies Spiel',s:null},
 {t:'Alle meine Entchen',s:[0,1,2,3,4,4,5,5,5,5,4,5,5,5,5,4,3,3,3,3,2,2,1,1,1,1,0]},
 {t:'Hänschen klein',s:[4,2,2,3,1,1,0,1,2,3,4,4,4,4,2,2,3,1,1,0,2,4,4,0]},
 {t:'Ode an die Freude',s:[2,2,3,4,4,3,2,1,0,0,1,2,2,1,1,2,2,3,4,4,3,2,1,0,0,1,2,1,0,0]},
 {t:'Jingle Bells (Refrain)',s:[2,2,2,2,2,2,2,4,0,1,2,3,3,3,3,3,2,2,2,2,1,1,2,1,4]}
];
var xs=0,xi=0;
function openXylo(){
  show('xylo');
  $('#x-song').innerHTML=XSONGS.map(function(s,i){return '<option value="'+i+'">'+esc(s.t)+'</option>'}).join('');
  $('#x-bars').innerHTML=XN.map(function(n,i){return '<button type="button" data-i="'+i+'" style="background:'+XCOL[i]+';height:'+(190-i*10)+'px" aria-label="Ton '+n[0]+(i===7?' hoch':'')+'">'+n[0]+(i===7?'′':'')+'</button>'}).join('');
  xs=0;xi=0;xRender();
}
function xRender(){
  var s=XSONGS[xs].s;
  $$('#x-bars button').forEach(function(b){b.classList.toggle('next',!!s&&+b.dataset.i===s[xi])});
  $('#x-hint').textContent=!s?'Tippe auf die Stäbe und probiere aus.':xi>=s.length?'Geschafft! 🎉 Du hast das ganze Lied gespielt.':'Tippe auf den leuchtenden Stab ('+(xi+1)+' von '+s.length+').';
  $('#x-tip').textContent=!s?'Tiefe Töne sind die langen Stäbe links, hohe die kurzen rechts.':'Gespielt wird Ton für Ton. Du kannst dir Zeit lassen.';
}
$('#x-bars').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var i=+b.dataset.i,s=XSONGS[xs].s;
  try{tone(XN[i][1],ac().currentTime,.5,.4)}catch(er){}
  b.classList.add('hit');setTimeout(function(){b.classList.remove('hit')},120);
  if(!s||xi>=s.length)return;
  if(i===s[xi]){
    xi++;
    if(xi>=s.length){PR.xp+=5;PR.days[MK.day()]=1;saveP();render()}
    xRender();
  }else{b.classList.add('no');setTimeout(function(){b.classList.remove('no')},260)}
});
$('#x-song').addEventListener('change',function(e){xs=+e.target.value;xi=0;xRender()});
$('#x-again').addEventListener('click',function(){xi=0;xRender()});
$('#x-close').addEventListener('click',function(){show('list');render()});
window.__th={XSONGS:XSONGS,get xi(){return xi},LES:LES,KG:KG,tapEval:tapEval,get PR(){return PR},get Q(){return Q}};
})();
</script>
