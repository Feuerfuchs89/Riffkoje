/* Hörlektion: höher oder tiefer, zu tief oder zu hoch */
function genHigh(){
  var base=rnd(55,70)+rnd(0,9)/10,d=pick([.8,.5,.35,.25]),up=Math.random()<.5,m2=base+(up?d:-d),ev=PF.seqEv([base,m2],.95,.8);

}
function genOff(){
  var ref=rnd(55,70),off=pick([-.5,-.35,0,.35,.5]),r=off===0?'Sauber':off<0?'Zu tief':'Zu hoch',ev=[{m:[ref],at:0,d:1},{m:[ref+off],at:1.4,d:1}];
  return {kind:'choice',text:'Erst kommt der Zielton, dann ein gesungener Ton. Wie ist er?',audio:ev,opts:[r].concat(['Zu tief','Sauber','Zu hoch'].filter(function(x){return x!==r})),ans:0,expl:off===0?'Beide Töne waren gleich.':'Der zweite Ton lag etwa '+Math.abs(Math.round(off*100))+' Cent '+(off<0?'unter':'über')+' dem Zielton.'};
}
